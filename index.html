<style>
/* Layout: 왼쪽 레일 + 작업 영역. 홈 = 가장 가까운 수업 하나를 크게, 진도표 = 엑셀 격자 + 우측 편집 패널 */
:root{
  --bg:#EDF2FA; --surface:#FFFFFF; --surface-2:#F4F7FC; --line:#DAE2F0; --line-2:#C7D3E8;
  --fg:#1A2440; --muted:#5D6984; --accent:#2D66E0; --accent-ink:#FFFFFF; --accent-soft:#E1EAFC;
  --fur:#D98E3E; --ok:#1C9466; --ok-soft:#DDF3EA; --warn:#B86E0C; --warn-soft:#FCEFD9; --bad:#CF4339; --bad-soft:#FBE3E1;
  --c1:#8DA4EA; --c2:#F08A4B; --c3:#F2C230; --c4:#7ED1B8; --c5:#C59BE8; --c6:#F28CA8; --c7:#9BC96A; --c8:#A6ADBA;
  --sheet:#FFF8DC; --zebra:#F7F9FD; --hover:#EEF3FF; --exam:#2D66E0;
  --f-body:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-display:var(--f-body);
  --f-mono:var(--f-body);
  --paw-off:#C9D0DE; --doing:#E5A512;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1424; --surface:#161F35; --surface-2:#1B2640; --line:#28355a; --line-2:#334366;
  --fg:#E5EBF8; --muted:#97A4C0; --accent:#6C98FF; --accent-ink:#0E1424; --accent-soft:#1D2E56;
  --ok:#3CC48E; --ok-soft:#173A2F; --warn:#E8A94A; --warn-soft:#3A2E17; --bad:#F07068; --bad-soft:#3E1D1D;
  --sheet:#25251a; --zebra:#182238; --hover:#1E2B4A; --exam:#6C98FF; --paw-off:#46537A; --doing:#F2BE4B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1424; --surface:#161F35; --surface-2:#1B2640; --line:#28355a; --line-2:#334366;
  --fg:#E5EBF8; --muted:#97A4C0; --accent:#6C98FF; --accent-ink:#0E1424; --accent-soft:#1D2E56;
  --ok:#3CC48E; --ok-soft:#173A2F; --warn:#E8A94A; --warn-soft:#3A2E17; --bad:#F07068; --bad-soft:#3E1D1D;
  --sheet:#25251a; --zebra:#182238; --hover:#1E2B4A; --exam:#6C98FF; --paw-off:#46537A; --doing:#F2BE4B; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.6;letter-spacing:-.005em;word-break:keep-all;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:208px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;padding:20px 12px;display:flex;flex-direction:column;gap:16px;border-right:1px solid var(--line);background:var(--surface);padding-left:max(12px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:6px;padding:0 4px}
.brand b{font-family:var(--f-display);font-size:25px;font-weight:800;letter-spacing:-.02em;color:var(--accent)}
.brand small{display:block;font-size:11px;color:var(--muted);line-height:1.35}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 12px;border-radius:10px;text-align:left;color:var(--muted);font-weight:500;position:relative}
.nav button svg{width:18px;height:18px;flex:none}
.nav button:hover{background:var(--surface-2);color:var(--fg)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.nav .badge{margin-left:auto;background:var(--bad);color:#fff;font-size:10px;font-weight:700;border-radius:99px;padding:0 6px;line-height:16px}
.savebox{margin-top:auto;font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:6px;padding:10px;border:1px solid var(--line);border-radius:10px}
.savebox .st{display:flex;gap:6px;align-items:center;font-weight:600}
.savebox .st i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.savebox .st.bad i{background:var(--bad)}
.savebox .ud{display:flex;gap:6px}
.jd{display:block;flex:none;object-fit:contain}
main{padding-block:20px 48px;padding-left:max(16px,2vw);padding-right:max(16px,2vw,env(safe-area-inset-right,0px));min-width:0}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.top h1{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:-.02em;margin:0}
.top .meta{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 11px;font-size:12px;color:var(--muted);white-space:nowrap}
.chip.hot{border-color:transparent;background:var(--accent);color:var(--accent-ink);font-weight:700}
button.chip{cursor:pointer}
button.chip[aria-pressed="false"]{opacity:.55;text-decoration:line-through}
button.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.card h2{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 .sub{font-weight:400;color:var(--muted);font-size:12px}
.card h2 .right{margin-left:auto;display:flex;gap:6px;align-items:center}
.grid{display:grid;gap:16px}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:9px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover:not(:disabled){filter:brightness(1.08);color:var(--accent-ink)}
.btn.bad{color:var(--bad)} .btn.badfill{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:3px 9px;font-size:12px;border-radius:7px}
.btn.lg{padding:10px 18px;font-size:15px;border-radius:11px}
.muted{color:var(--muted)}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.tag{font-size:11px;font-weight:700;border-radius:6px;padding:1px 7px;white-space:nowrap;display:inline-flex;align-items:center;gap:3px;line-height:18px}
.tag svg{flex:none}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.info{background:var(--accent-soft);color:var(--accent)}
.tag.gray{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.field input,.field select,.field textarea,.inp{border:1px solid var(--line-2);background:var(--surface);border-radius:9px;padding:7px 10px;font-size:14px;color:var(--fg);min-width:0;width:100%}
.field input:disabled{opacity:.5}
.note{font-size:12px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:10px 12px;border:1px dashed var(--line-2);margin:0}
.warnbox{font-size:13px;background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:9px 12px;margin:0}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:9px;overflow:hidden;flex:none;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:5px 12px;font-size:12px;font-weight:600;color:var(--muted);display:inline-flex;gap:5px;align-items:center}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.sect{font-size:12px;font-weight:700;color:var(--muted);margin:18px 0 8px;display:flex;gap:6px;align-items:center;letter-spacing:.02em}

/* 일정 칸 공통 */
.sess{display:flex;align-items:center;gap:5px;width:100%;border:1px solid var(--line);border-left:4px solid var(--cc);background:var(--surface);border-radius:7px;padding:3px 6px;font-size:12px;font-weight:700;text-align:left;min-width:0}
.sess span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sess small{font-weight:500;color:var(--muted)}
.sess:hover{border-color:var(--accent)}
.sess.done{background:var(--ok-soft)} .sess.done svg{color:var(--ok)}
.sess.plan svg{color:var(--accent)}
.sess.check{background:var(--warn-soft);color:var(--warn)}
.sess.absent{background:var(--bad-soft);color:var(--bad);text-decoration:line-through;border-left-style:dashed}
.sess.moved{background:var(--surface-2);color:var(--muted);text-decoration:line-through;border-left-style:dashed;font-weight:500}

/* ---- 홈 ---- */
.guide{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.guide .bubble{background:var(--surface);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:8px 14px;font-size:14px}
.guide .bubble b{color:var(--accent)}
.sumbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:16px}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:2px;text-align:left}
.sum span{font-size:12px;color:var(--muted)}
.sum b{font-size:24px;line-height:1.1}
.sum.alert{border-color:var(--bad);background:var(--bad-soft)}
.sum.alert b,.sum.alert span{color:var(--bad)}
.sum.warn{border-color:var(--warn);background:var(--warn-soft)}
.sum.warn b,.sum.warn span{color:var(--warn)}
button.sum:hover{border-color:var(--accent)}
.homegrid{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
.focus{border:2px solid var(--accent);border-radius:18px;background:var(--surface);overflow:hidden;display:grid;grid-template-columns:120px minmax(0,1fr)}
.focus .when{background:var(--cc);color:#1A2440;padding:16px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.focus .when .p{font-family:var(--f-display);font-weight:800;font-size:32px;line-height:1;white-space:nowrap}
.focus .when .tm{font-size:13px;font-weight:600}
.focus .when .st{margin-top:8px;font-size:11px;font-weight:700;background:rgba(255,255,255,.75);border-radius:99px;padding:2px 8px;align-self:flex-start}
.focus .body{padding:16px 18px;display:flex;flex-direction:column;gap:8px;min-width:0}
.focus .cls{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.focus .cls b{font-size:18px;color:var(--fg)}
.focus .ttl{font-size:20px;font-weight:700;line-height:1.35;text-wrap:balance}
.focus .info{display:grid;gap:4px;font-size:13px;margin:0}
.focus .info div{display:flex;gap:8px}
.focus .info dt{color:var(--muted);flex:none;width:66px}
.focus .info dd{margin:0}
.focus .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.row{display:grid;grid-template-columns:70px 6px minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 12px}
.row+.row{margin-top:6px}
.row .pp{font-weight:700;font-size:13px}
.row .pp small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.row .bar{width:6px;height:30px;border-radius:3px;background:var(--cc)}
.row .ls{min-width:0}
.row .ls b{font-size:14px}
.row .ls small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.row.done{background:var(--surface-2);border-style:dashed}
.row.done .ls b,.row.done .ls small{color:var(--muted)}
.row.check{border-color:var(--warn);background:var(--warn-soft)}
.row.absent{border-style:dashed;background:var(--bad-soft)}
.row.absent .ls b{text-decoration:line-through;color:var(--bad)}
.stamp{color:var(--ok);display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:12px}
.todo{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.todo li{display:flex;gap:9px;align-items:flex-start;font-size:13px}
.todo input{margin-top:4px;accent-color:var(--accent)}
.todo li.d label{text-decoration:line-through;color:var(--muted)}
.mini{display:flex;flex-direction:column;gap:6px}
.mini > div{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px}
.mini .tr{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.mini .tr i{display:block;height:100%;background:var(--cc);border-radius:99px}
.meal ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.meal li{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted var(--line-2);padding-bottom:3px}
.meal li span:last-child{font-size:11px;color:var(--muted)}
.mealhead{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.babs{display:block;flex:none;object-fit:contain}
.bowl{width:40px;height:40px;border-radius:50%;background:var(--warn-soft);color:var(--warn);display:grid;place-items:center;flex:none}

/* ---- 진도표 ---- */
.sheetlay{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
.sheetlay.withp{grid-template-columns:minmax(0,1fr) 300px}
.cl{display:flex;gap:4px;align-items:flex-start;padding:0 2px 2px}
.cl .pen{flex:none;width:24px;height:24px;border:0;border-radius:6px;background:none;color:var(--muted);display:grid;place-items:center;padding:0}
.cl .pen:hover{background:var(--accent-soft);color:var(--accent)}
.cl .pen.has{color:var(--accent)}
.cl .ctx{flex:1;min-width:0;font-size:12px;line-height:1.45;color:var(--muted);padding:3px 2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;cursor:text;word-break:break-all}
.cl .ctx.ph{color:var(--line-2);cursor:pointer}
.cl textarea.ie{font-size:12.5px;font-weight:400;min-height:48px;border-color:var(--line-2);background:var(--surface)}
.cl .nb{flex:none;font-size:10px;font-weight:700;border-radius:4px;padding:1px 5px;margin-top:4px;background:var(--warn-soft);color:var(--warn);border:0}
.sheetbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.sheetbar .gap{flex:1}
.astrip{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.achip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 10px;font-size:12.5px;text-align:left}
.achip:hover{border-color:var(--accent)}
.achip b{font-family:var(--f-mono);font-size:13px}
.achip.exam{border-left:4px solid var(--exam)} .achip.exam b{color:var(--exam)}
.achip.task{border-left:4px solid var(--warn)} .achip.task b{color:var(--warn)}
.achip.past{opacity:.55}
.sheet-wrap{overflow:auto;max-height:calc(100vh - 210px);min-height:260px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface)}
table.sheet{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:13px}
.sheet th,.sheet td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:4px 6px;vertical-align:top;background:var(--surface)}
.sheet thead th{position:sticky;top:0;z-index:3;background:var(--surface-2);font-size:12px;color:var(--muted);font-weight:700;text-align:left;vertical-align:bottom;border-bottom:2px solid var(--line-2)}
.sheet .n{position:sticky;left:0;z-index:2;width:64px;min-width:64px;text-align:center}
.sheet td.n .nw{display:flex;align-items:center;justify-content:center;gap:0}
.sheet .tp{position:sticky;left:64px;z-index:2;width:var(--tpw,170px);min-width:var(--tpw,170px);max-width:var(--tpw,170px);border-right:2px solid var(--line-2)}
.sheet thead .tp{padding-right:10px}
.sheet thead .n,.sheet thead .tp{z-index:4}
.sheet tbody tr:nth-child(even) td{background:var(--zebra)}
.sheet tbody tr:hover td{background:var(--hover)}
.sheet td.n{font-weight:700;font-size:14px;padding:4px 2px;vertical-align:top}
.sheet td.n .num{display:block;padding:0 2px;font-size:15px}
.infob{display:block;margin:3px auto 0;width:18px;height:18px;border:1px solid var(--line-2);background:none;color:var(--muted);border-radius:50%;padding:0;cursor:pointer;line-height:1;font-size:11px;font-weight:700;font-family:Georgia,serif;font-style:italic}
.infob::before{content:'i'}
.infob:hover,.infob.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rz{position:absolute;top:0;right:-4px;width:10px;height:100%;cursor:col-resize;touch-action:none;z-index:5}
.rz::after{content:'';position:absolute;left:4px;top:25%;height:50%;width:3px;border-radius:3px;background:var(--line-2)}
.rz:hover::after{background:var(--accent)}
.sheet td.n .rm{border:0;background:none;color:var(--muted);font-size:15px;line-height:1;padding:2px 6px;border-radius:6px}
.sheet td.n .rm:hover{background:var(--accent-soft);color:var(--accent)}
.sheet td.n.inexam{box-shadow:inset 4px 0 0 var(--exam)}
.rbadge{display:block;font-size:10px;font-weight:700;border-radius:4px;padding:0 3px;margin:2px auto 0;width:max-content;max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rbadge.exam{background:var(--accent-soft);color:var(--exam)} .rbadge.task{background:var(--warn-soft);color:var(--warn)}
.ie{display:block;width:100%;border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 6px;font-size:13px;line-height:1.45;color:var(--fg);resize:none;field-sizing:content;min-height:28px;overflow:hidden;font-family:inherit}
textarea.ie{min-height:28px}
.ie::placeholder{color:var(--line-2)}
.ie:hover{border-color:var(--line-2);background:var(--surface)}
.ie:focus{outline:none;border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft)}
.tp .ie{font-weight:600;font-size:13.5px}
.nt .ie{color:var(--warn)}
.sheet th.cls{min-width:100px;width:100px;border-top:6px solid var(--cc);background:var(--surface);color:var(--fg);padding:6px}
.sheet th.cls .ie{font-size:15px;font-weight:700;padding:2px 4px;min-height:0}
.sheet th.cls .ie.lead{font-size:12px;font-weight:500;color:var(--muted)}
.sheet th.cls .stat{display:flex;gap:4px;flex-wrap:wrap;align-items:center;font-size:11px;font-weight:500;color:var(--muted);padding:2px 4px}
.sheet th.cls .hd{display:flex;align-items:center;gap:2px}
.sheet th.cls .hd .rm{margin-left:auto;border:0;background:none;color:var(--muted);font-size:15px;padding:0 4px;border-radius:6px}
.sheet th.cls .hd .rm:hover{background:var(--accent-soft);color:var(--accent)}
.sheet th.addc{min-width:80px;vertical-align:middle;text-align:center;background:var(--surface)}
.cell{cursor:pointer;position:relative;vertical-align:middle!important;padding:4px 5px!important}
.cell:hover{background:var(--accent-soft)!important}
.cell .in{display:flex;align-items:center;gap:3px}
.tog{width:28px;height:28px;border-radius:50%;border:0;background:none;display:inline-grid;place-items:center;padding:0;color:var(--paw-off);flex:none;transition:color .15s,transform .15s}
.tog:hover{color:color-mix(in srgb,var(--ok) 50%,var(--paw-off));transform:scale(1.08)}
.cell.doing .tog,.tog.doing{color:var(--doing)}
.cell.done .tog,.tog.on{color:var(--ok)}
.cell.done .tog:hover,.tog.on:hover{color:var(--ok)}
.cell .dt{font-size:16px;font-weight:800;line-height:1.15;letter-spacing:-.02em}
.cell .dt small{display:block;font-size:12.5px;font-weight:600;color:var(--muted)}
.cell.done .dt small{color:var(--ok)}
.pl{font-size:13.5px;font-weight:600;color:var(--muted);line-height:1.15}
.pl small{display:block;font-size:11.5px;font-weight:500}
.nx{font-size:14px;color:var(--accent);font-weight:800;line-height:1.15}
.nx small{display:block;font-size:11.5px;font-weight:600}
.cell.next{background:var(--accent-soft)!important}
.cell .mm{display:block;font-size:11px;color:var(--warn);line-height:1.3;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:92px}
.cell .cf{position:absolute;top:3px;right:3px;color:var(--bad)}
.cell.sel{box-shadow:inset 0 0 0 2px var(--accent);background:var(--accent-soft)!important}
.cell.also{box-shadow:inset 0 0 0 2px var(--accent);background:repeating-linear-gradient(135deg,var(--surface) 0 6px,var(--accent-soft) 6px 12px)!important}
.addrow td{background:var(--surface)!important;padding:8px!important}
.addrow .inner{display:flex;gap:6px;flex-wrap:wrap;align-items:center;position:sticky;left:8px;width:max-content}
.emptyrow td{padding:28px 16px!important;text-align:left;color:var(--muted)}
.ex{font-size:10px;color:var(--muted);border:1px solid var(--line-2);border-radius:4px;padding:0 4px;margin-left:4px;font-weight:500}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center;margin-bottom:10px}
.legend > span{display:inline-flex;gap:5px;align-items:center}
.clist{display:flex;flex-direction:column;gap:6px}
.crow{display:grid;grid-template-columns:52px 32px minmax(0,1fr) 92px;gap:10px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;cursor:pointer}
.crow:hover{border-color:var(--line-2)}
.crow.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.crow.next{border-style:dashed;border-color:var(--accent)}
.crow small{display:block;color:var(--muted);font-size:12px}
.classtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.classtabs button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 14px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.classtabs button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.panel{position:sticky;top:16px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 32px);overflow:auto}
.panel .ph{display:flex;align-items:flex-start;gap:8px}
.panel .ph h3{margin:0;font-size:17px}
.panel .ph p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.panel .ph .x{margin-left:auto}
.psec{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.psec h4{margin:0;font-size:12px;color:var(--muted);font-weight:700}
.others{display:flex;flex-direction:column;gap:4px}
.others label{display:flex;gap:8px;align-items:center;font-size:13px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);color:var(--fg);cursor:pointer}
.others label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.others input{accent-color:var(--accent)}
.others .cur{margin-left:auto;font-size:12px;color:var(--muted);text-align:right}
.pv{border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:13px}
.pv > div{display:grid;grid-template-columns:44px minmax(0,1fr) 14px minmax(0,1fr);gap:6px;padding:6px 10px;align-items:center}
.pv > div.ln{grid-template-columns:minmax(0,1fr)}
.pv > div+div{border-top:1px solid var(--line)}
.pv .b{color:var(--muted);text-decoration:line-through}
.pv .a{font-weight:700;color:var(--accent)}
.pv .w{color:var(--warn)}
.pv .empty{display:block;color:var(--muted);font-size:12px;padding:8px 10px}
.hist{display:flex;flex-direction:column;gap:4px;font-size:12px}
.hist > div{display:flex;gap:8px;align-items:center;color:var(--muted)}
.hist > div span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist time{font-family:var(--f-mono);font-size:11px;flex:none}
.panel-empty{color:var(--muted);font-size:13px;text-align:left;padding:4px 2px;line-height:1.7}
.panel-empty ol{margin:6px 0 0;padding-left:18px}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatches button{width:28px;height:28px;border-radius:50%;border:2px solid transparent;background:var(--sw)}
.swatches button[aria-pressed="true"]{border-color:var(--fg)}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.step{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.step b{font-size:14px}
.step.ok{border-color:var(--ok);background:var(--ok-soft)}
.step .num{font-family:var(--f-mono);font-size:12px;color:var(--muted)}

/* ---- 시간표 ---- */
.ttlay{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
.alertbar{display:flex;gap:10px;align-items:center;background:var(--bad-soft);border:1px solid var(--bad);color:var(--bad);border-radius:12px;padding:8px 14px;margin-bottom:16px;font-weight:600;flex-wrap:wrap}
.alertbar.w{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.alertbar .btn{margin-left:auto}
.tt-wrap{overflow-x:auto}
table.tt{border-collapse:separate;border-spacing:4px;width:100%;min-width:520px;table-layout:fixed}
.tt th{font-size:12px;color:var(--muted);font-weight:600;padding:2px}
.tt th.today{color:var(--accent)}
.tt td{height:44px;border-radius:8px;background:var(--surface-2);vertical-align:middle;padding:3px}
.tt td .stk{display:flex;flex-direction:column;gap:3px}
.tt td.hol{font-size:11px;color:var(--bad);text-align:center}
table.mtt{border-spacing:3px;min-width:240px}
.mtt td{height:30px;text-align:center;font-weight:700;font-size:11px;padding:1px}
.mtt td.on{background:color-mix(in srgb,var(--cc) 35%,var(--surface))}
.mtt td.hl{outline:2px solid var(--bad);outline-offset:-2px}
.mtt td.gone{background:repeating-linear-gradient(135deg,var(--bad-soft) 0 5px,var(--surface-2) 5px 10px);color:var(--bad);text-decoration:line-through;outline:2px solid var(--bad);outline-offset:-2px}
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.cmp h4{margin:0 0 4px;font-size:12px;color:var(--muted)}
.chg{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.chg+.chg{margin-top:10px}
.chg.new{border-left:5px solid var(--bad)}
.chg .hd{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chg .vs{display:grid;grid-template-columns:minmax(0,1fr) 18px minmax(0,1fr);gap:6px;align-items:center;font-size:13px}
.chg .vs > div{background:var(--surface-2);border-radius:8px;padding:6px 9px}
.chg .vs small{display:block;font-size:10px;color:var(--muted)}
.chg .vs .after{background:var(--accent-soft)}
.chg .vs .after.cancel{background:var(--bad-soft);color:var(--bad)}
.chg .ft{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.chg .ft .gap{margin-left:auto}
.excl{display:flex;flex-direction:column;gap:6px}
.exc{display:grid;grid-template-columns:8px minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px}
.exc .bar{width:6px;height:100%;min-height:30px;border-radius:3px;background:var(--cc)}
.exc small{display:block;color:var(--muted);font-size:12px}
.exc.off{opacity:.6}
.exc.off b{text-decoration:line-through}
.ttedit td{padding:2px}
.ttedit select{width:100%;border:1px solid var(--line-2);border-radius:6px;background:var(--surface);padding:4px;font-size:12px}

/* ---- 캘린더 ---- */
.calbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}

    <div class="brand"><span id="brandDog"></span><div><b>진도깨</b><small>선생님의 충직한 진도 관리 도우미</small></div></div>

<script>
/* ================= CORE: 화면과 무관한 데이터·계산 ================= */
const PALETTE=8;
const DEFAULT_PTIME={1:'08:50',2:'09:50',3:'10:50',4:'11:50',5:'13:40',6:'14:40',7:'15:40'};
/* 기본 공휴일 (NEIS 학사일정을 가져오면 그 내용이 함께 쓰여요) */
const HOLIDAYS=[
 {s:'2026-08-15',e:'2026-08-15',label:'광복절'},{s:'2026-09-24',e:'2026-09-26',label:'추석 연휴'},
 {s:'2026-10-03',e:'2026-10-03',label:'개천절'},{s:'2026-10-05',e:'2026-10-05',label:'대체공휴일'},
 {s:'2026-10-09',e:'2026-10-09',label:'한글날'},{s:'2026-12-25',e:'2026-12-25',label:'성탄절'},
 {s:'2027-01-01',e:'2027-01-01',label:'신정'}];
const REASONS=['출장','학교 행사','휴업','기타'];
const LESSON_FIELDS=['topic','pages','content','note'];

/* ---- 날짜 ---- */
const pad=n=>String(n).padStart(2,'0');
const key=dt=>`${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`;
const D=s=>new Date(s+'T00:00:00');
const md=s=>{const d=D(s);return `${d.getMonth()+1}/${d.getDate()}`};
const WD='일월화수목금토';
const wd=s=>WD[D(s).getDay()];
const mdw=s=>`${md(s)}(${wd(s)})`;
const addDays=(dt,n)=>{const x=new Date(dt);x.setDate(x.getDate()+n);return x};
const addK=(k,n)=>key(addDays(D(k),n));
const mondayOf=k=>addK(k,1-(D(k).getDay()||7));
const toMin=t=>{const [h,m]=String(t||'00:00').split(':');return +h*60+ +m};
let TK=key(new Date()),NOWMIN=0;
function setClock(k,m){TK=k;NOWMIN=m}
const clone=o=>JSON.parse(JSON.stringify(o));
let _id=0;const uid=p=>p+Date.now().toString(36)+(_id++).toString(36);
const stamp=()=>{const n=new Date();return `${n.getMonth()+1}/${n.getDate()} ${pad(n.getHours())}:${pad(n.getMinutes())}`};

/* ---- 빈 데이터 ---- */
function emptyDB(){return {v:4,term:{start:'2026-08-17',end:'2026-12-31'},periods:{...DEFAULT_PTIME},
  trackFrom:null,classes:[],lessons:[],records:{},tt:[{from:'2026-08-17',slots:[]}],exc:[],inbox:[],events:[],assess:[],todos:[]}}
function validDB(db){return db&&db.v===4&&db.term&&Array.isArray(db.classes)&&Array.isArray(db.lessons)&&db.records&&Array.isArray(db.tt)&&Array.isArray(db.exc)&&Array.isArray(db.assess)}

/* ---- 학급·차시 ---- */
const clsIds=db=>db.classes.map(c=>c.id);
const lessonIdx=(db,id)=>db.lessons.findIndex(l=>l.id===id)+1; // 차시 번호 (없으면 0)
const rec=(db,c,n)=>{const l=db.lessons[n-1];return l&&db.records[c]?db.records[c][l.id]:undefined};
function setRec(db,c,n,val){const l=db.lessons[n-1];if(!l)return;db.records[c]=db.records[c]||{};if(val)db.records[c][l.id]=val;else delete db.records[c][l.id]}
function nextN(db,c){let n=1;while(n<=db.lessons.length&&rec(db,c,n)?.done)n++;return n}
function recDates(db,c){const m={};db.lessons.forEach((l,i)=>{const r=db.records[c]?.[l.id];if(r&&r.done&&r.date)(m[r.date]=m[r.date]||[]).push(i+1)});return m}
const newLesson=()=>({id:uid('l'),topic:'',pages:'',content:'',note:'',materials:''});

/* ---- 수업 없는 날 ---- */
const inRange=(k,e)=>k>=e.s&&k<=(e.e||e.s);
const targets=(db,a)=>a.classes==='all'||!a.classes?clsIds(db):a.classes;
function dayBlock(db,k){const dw=D(k).getDay();if(dw===0||dw===6)return '주말';
  const h=HOLIDAYS.find(e=>inRange(k,e))||db.events.find(e=>e.block&&inRange(k,e));return h?h.label:null}
function classBlock(db,k,c){const g=dayBlock(db,k);if(g)return g;
  const a=db.assess.find(x=>x.type==='exam'&&x.noClass&&k>=x.start&&k<=(x.end||x.start)&&targets(db,x).includes(c));return a?a.title:null}
function ttFor(db,k){let v=null;for(const t of db.tt)if(t.from<=k&&(!v||t.from>=v.from))v=t;return v?v.slots:[]}
const isPast=(db,k,p)=>k<TK||(k===TK&&toMin(db.periods[p])+50<=NOWMIN);
const isNow=(db,k,p)=>k===TK&&toMin(db.periods[p])<=NOWMIN&&NOWMIN<toMin(db.periods[p])+50;

/* 하루의 수업 칸. 결손·이동된 원래 칸도 지우지 않고 상태로 남긴다 */
function rawSessions(db,k,ex){
  const dw=D(k).getDay();const ids=clsIds(db);
  const out=ttFor(db,k).filter(s=>s.d===dw&&ids.includes(s.c)&&!classBlock(db,k,s.c)).map(s=>({date:k,c:s.c,p:s.p,st:'on'}));
  ex.forEach(e=>{if(e.type==='move'&&e.date===k){const t=out.find(x=>x.st==='on'&&!x.movedIn&&x.c===e.c&&x.p===e.p);if(t){t.st='movedOut';t.excId=e.id}}});
  ex.forEach(e=>{if(e.type==='move'&&e.toDate===k&&ids.includes(e.c)&&!classBlock(db,k,e.c)&&originOk(db,e))out.push({date:k,c:e.c,p:e.toP,st:'on',movedIn:e.id,from:{date:e.date,p:e.p}})});
  ex.forEach(e=>{if(e.type==='absence'&&e.date===k){const t=out.find(x=>x.st==='on'&&x.c===e.c&&x.p===e.p);if(t){t.st='absent';t.excId=e.id}}});
  return out.sort((a,b)=>a.p-b.p||(a.st==='on'?-1:1));
}
function originOk(db,e){if(classBlock(db,e.date,e.c))return false;const dw=D(e.date).getDay();return ttFor(db,e.date).some(s=>s.d===dw&&s.c===e.c&&s.p===e.p)}
const activeExc=(db,opt={})=>db.exc.filter(e=>e.state==='active'&&!(opt.skip||[]).includes(e.id)).concat(opt.extra||[]);
/* 발자국을 눌렀을 때 기록할 날짜: 앞 차시보다 항상 뒤(오름차순)가 되도록, 아직 기록되지 않은 수업 칸 중 가장 이른 날 */
function suggestDateDb(db,c,n){const ex=activeExc(db),recs=db.records[c]||{};
  let lo=db.term.start;for(let i=1;i<n;i++){const r=rec(db,c,i);if(r&&r.done&&r.date>lo)lo=r.date}
  const used={};Object.values(recs).forEach(r=>{if(r.done&&r.date)used[r.date]=(used[r.date]||0)+1});
  const pick=(from,to)=>{for(let k=from;k<=to;k=addK(k,1)){const cnt=rawSessions(db,k,ex).filter(x=>x.c===c&&x.st==='on').length;if(cnt&&(used[k]||0)<cnt)return k}return null};
  const yest=addK(TK,-1),tf=db.trackFrom&&db.trackFrom>lo?db.trackFrom:lo;
  return (tf<=yest&&pick(tf,yest))||pick(lo,TK)||TK}

/* 모든 화면이 쓰는 단 하나의 일정 계산.
   완료 = 그날 실제 기록이 있는 칸 / 확인 필요 = 지난 칸인데 기록 없음 / 예정 = 앞으로의 칸, 다음 차시부터 순서대로 배정 */
function buildSched(db,opt={}){
  const ex=activeExc(db,opt);
  const S={by:{},cls:{},key:{},plan:{},conflicts:[],nextN:{},absent:{}};
  const rd={},used={},nx={};
  clsIds(db).forEach(c=>{rd[c]=recDates(db,c);used[c]={};nx[c]=nextN(db,c);S.cls[c]=[];S.plan[c]={};S.nextN[c]=nx[c];S.absent[c]=0});
  const {start,end}=db.term;
  for(let k=start;k<=end;k=addK(k,1)){
    const ss=rawSessions(db,k,ex);
    S.by[k]=ss.filter(s=>!(db.trackFrom&&k<db.trackFrom&&s.st==='on'&&!(rd[s.c][k]||[]).length));
    for(const s of S.by[k]){s.key=`${k}|${s.c}|${s.p}`;
      if(s.st==='absent'){s.status='absent';S.absent[s.c]++}
      else if(s.st==='movedOut')s.status='moved';
      else{const r=rd[s.c][k]||[],u=used[s.c][k]||0;
        if(u<r.length){s.status='done';s.n=r[u];used[s.c][k]=u+1}
        else if(isPast(db,k,s.p))s.status='check';
        else{s.status='plan';s.n=nx[s.c]++;if(!S.plan[s.c][s.n])S.plan[s.c][s.n]=s}}
      S.key[s.key]=s;S.cls[s.c].push(s)}
  }
  /* 그날 이 반 수업 칸이 하나도 없으면 충돌. 한 시간에 여러 차시를 기록한 경우는 정상 */
  clsIds(db).forEach(c=>{for(const [k,arr] of Object.entries(rd[c])){if(!(used[c][k]>0))arr.forEach(n=>S.conflicts.push({c,n,date:k}))}});
  return S;
}
/* 일정 (공휴일 + 학교 일정 + 평가) */
function allEvents(db){return HOLIDAYS.map(h=>({...h,kind:'hol',block:true,src:'기본 공휴일'}))
  .concat(db.events.map(e=>({...e,kind:e.kind||'event'})))
  .concat(db.assess.map(a=>({s:a.start,e:a.end||a.start,label:a.title,kind:a.type,assessId:a.id,block:a.type==='exam'&&a.noClass})))}
const eventsOn=(db,k)=>allEvents(db).filter(e=>inRange(k,e));
function nextExam(db,c){return db.assess.filter(a=>a.type==='exam'&&a.start>TK&&(!c||targets(db,a).includes(c))).sort((a,b)=>a.start<b.start?-1:1)[0]}
const lastBefore=(S,c,k)=>{let n=(S.nextN[c]||1)-1;for(const s of S.cls[c]||[])if(s.status==='plan'&&s.date<k)n=Math.max(n,s.n);return n};
/* 시험 범위 도달 예측: 시험 시작 전까지 예정 수업으로 범위 끝 차시를 마칠 수 있는지 */
function examReach(db,S,a,c){const to=a.toId?lessonIdx(db,a.toId):0;if(!to)return null;
  const last=lastBefore(S,c,a.start);return {to,last,short:Math.max(0,to-last)}}

/* ---- 변경 동작 (db를 직접 바꾼다. 화면 쪽에서 실행 취소용 스냅숏을 남긴다) ---- */
const C={
  complete(db,c,n,date){const r=rec(db,c,n)||{};setRec(db,c,n,{done:true,date,memo:r.memo||'',actual:r.actual||''})},
  uncomplete(db,c,n){const r=rec(db,c,n);if(!r)return;if(r.memo||r.actual)setRec(db,c,n,{...r,done:false,date:''});else setRec(db,c,n,null)},
  setRecord(db,c,n,val){setRec(db,c,n,val)},
  absence(db,list,reason,note,opt={}){
    list.forEach(s=>{if(opt.revertDone&&s.status==='done')C.uncomplete(db,s.c,s.n);
      db.exc.push({id:uid('a'),type:'absence',date:s.date,c:s.c,p:s.p,reason,note:note||'',src:opt.src||'직접',state:'active',at:stamp()})})},
  move(db,s,toDate,toP,note,opt={}){let od=s.date,op=s.p;
    if(s.movedIn){const prev=db.exc.find(e=>e.id===s.movedIn);od=prev.date;op=prev.p;prev.state='cancelled'}
    if(opt.revertDone&&s.status==='done')C.uncomplete(db,s.c,s.n);
    if(od===toDate&&op===toP)return;
    db.exc.push({id:uid('m'),type:'move',date:od,c:s.c,p:op,toDate,toP,reason:opt.reason||'수업 이동',note:note||'',src:opt.src||'직접',state:'active',at:stamp()})},
  setExc(db,id,state){const e=db.exc.find(x=>x.id===id);if(e)e.state=state},
  accept(db,id,opt={}){const i=db.inbox.find(x=>x.id===id);const S=buildSched(db);
    const s=S.key[`${i.date}|${i.c}|${i.p}`];
    if(!s||!['plan','check','done'].includes(s.status))return false;
    if(i.type==='move'&&validateMove(db,S,s,i.toDate,i.toP))return false;
    const before=db.exc.length;
    if(i.type==='absence')C.absence(db,[s],'학교 행사',i.why,{src:'시간표 변경',revertDone:opt.revertDone});
    else C.move(db,s,i.toDate,i.toP,i.why,{src:'시간표 변경',reason:'시간표 변경',revertDone:opt.revertDone});
    i.state='accepted';i.excId=db.exc.length>before?db.exc[db.exc.length-1].id:null;return true},
  dismiss(db,id){db.inbox.find(x=>x.id===id).state='dismissed'},
  setTT(db,from,slots){db.tt=db.tt.filter(t=>t.from<from);db.tt.push({from,slots:clone(slots)});db.tt.sort((a,b)=>a.from<b.from?-1:1)},
  /* 학급 */
  addClass(db,name,lead){const used=db.classes.map(c=>c.color);let color=1;for(let i=1;i<=PALETTE;i++){if(!used.includes(i)){color=i;break}color=(db.classes.length%PALETTE)+1}
    const c={id:uid('c'),name,lead:lead||'',color};db.classes.push(c);db.records[c.id]={};return c},
  setClass(db,id,f,v){const c=db.classes.find(x=>x.id===id);if(c)c[f]=v},
  moveClass(db,id,dir){const i=db.classes.findIndex(c=>c.id===id),j=i+dir;if(i<0||j<0||j>=db.classes.length)return false;const t=db.classes[i];db.classes[i]=db.classes[j];db.classes[j]=t},
  removeClass(db,id){db.classes=db.classes.filter(c=>c.id!==id);delete db.records[id];
    db.tt.forEach(t=>t.slots=t.slots.filter(s=>s.c!==id));db.exc=db.exc.filter(e=>e.c!==id);db.inbox=db.inbox.filter(e=>e.c!==id);
    db.assess.forEach(a=>{if(Array.isArray(a.classes))a.classes=a.classes.filter(x=>x!==id)})},
  /* 차시 */
  addLessons(db,count,at){const ls=Array.from({length:count},newLesson);const i=at==null?db.lessons.length:Math.max(0,Math.min(at,db.lessons.length));db.lessons.splice(i,0,...ls);return ls},
  setLesson(db,n,f,v){const l=db.lessons[n-1];if(l)l[f]=v},
  moveLesson(db,n,dir){const i=n-1,j=i+dir;if(j<0||j>=db.lessons.length)return false;const t=db.lessons[i];db.lessons[i]=db.lessons[j];db.lessons[j]=t},
  removeLesson(db,n){const l=db.lessons[n-1];if(!l)return;db.lessons.splice(n-1,1);Object.values(db.records).forEach(r=>delete r[l.id]);
    db.assess.forEach(a=>{if(a.fromId===l.id)a.fromId=null;if(a.toId===l.id)a.toId=null;if(a.lessonId===l.id)a.lessonId=null})},
  /* 표 붙여넣기: n차시의 field 열부터 rows(2차원) 채우기, 모자라면 차시 추가 */
  pasteGrid(db,n,field,rows){const f0=LESSON_FIELDS.indexOf(field);let added=0;
    rows.forEach((cols,ri)=>{const idx=n-1+ri;if(idx>=db.lessons.length){C.addLessons(db,1);added++}
      cols.forEach((v,ci)=>{const f=LESSON_FIELDS[f0+ci];if(f)db.lessons[idx][f]=v.trim()})});return added},
  /* 평가 */
  saveAssess(db,a){const i=db.assess.findIndex(x=>x.id===a.id);if(i>=0)db.assess[i]=a;else db.assess.push({...a,id:a.id||uid('v')})},
  removeAssess(db,id){db.assess=db.assess.filter(a=>a.id!==id)},
  /* 학교 일정 */
  addEvent(db,e){db.events.push({...e,id:uid('e')})},
  removeEvent(db,id){db.events=db.events.filter(e=>e.id!==id)},
  importNeisEvents(db,evs,exams){db.events=db.events.filter(e=>e.src!=='NEIS');evs.forEach(e=>db.events.push({...e,id:uid('n'),src:'NEIS'}));
    db.assess=db.assess.filter(a=>a.src!=='NEIS');exams.forEach(a=>db.assess.push({...a,id:uid('v'),src:'NEIS'}))},
};
function validateMove(db,S,s,toDate,toP){
  if(!toDate)return '옮길 날짜를 고르세요.';
  if(toDate<db.term.start||toDate>db.term.end)return '학기 기간 밖의 날짜예요.';
  const b=classBlock(db,toDate,s.c);if(b)return `${md(toDate)}은 ${b}라서 수업을 넣을 수 없어요.`;
  const occ=(S.by[toDate]||[]).find(x=>x.p===toP&&['plan','check','done'].includes(x.status)&&x.key!==s.key);
  if(occ)return `${md(toDate)} ${toP}교시에는 이미 ${clsName(db,occ.c)} 수업이 있어요.`;
  if(toDate===s.date&&toP===s.p)return '지금과 같은 날짜·교시예요.';
  return '';
}
const clsName=(db,id)=>(db.classes.find(c=>c.id===id)||{name:'?'}).name||'(이름 없음)';
function shiftNote(before,after,c,n){
  const a=after.plan[c][n],b=before.plan[c][n];
  if(!a)return `${n}차시를 넣을 수업이 학기 안에 남지 않아요`;
  if(b&&a.key===b.key)return `${n}차시 일정은 그대로예요`;
  return `${n}차시가 ${mdw(a.date)} ${a.p}교시로 ${b&&a.date<b.date?'당겨져요':'밀려요'}`;
}

function parseMeal(row){const items=String(row.DDISH_NM||'').split(/<br\s*\/?>|\n/i).map(x=>x.trim()).filter(Boolean).map(x=>{const m=x.match(/\(([\d.\s]+)\)\s*$/);return {name:x.replace(/\(([\d.\s]+)\)\s*$/,'').replace(/[*★]+$/,'').trim(),alg:m?m[1].replace(/\s/g,'').replace(/\.$/,''):''}});
  const y=String(row.MLSV_YMD);return {date:`${y.slice(0,4)}-${y.slice(4,6)}-${y.slice(6,8)}`,type:row.MMEAL_SC_NM||'',items,cal:row.CAL_INFO||''}}
function parseSchedule(rows){const ymd=y=>`${y.slice(0,4)}-${y.slice(4,6)}-${y.slice(6,8)}`;
  const evs=[],examDays={};
  rows.forEach(r=>{const k=ymd(String(r.AA_YMD)),nm=String(r.EVENT_NM||'').trim();if(!nm||nm==='토요휴업일')return;
    const sub=String(r.SBTR_DD_SC_NM||'');const isHol=sub==='휴업일'||sub==='공휴일'||/휴업|방학|공휴일/.test(nm)&&!/개학|식$/.test(nm);
    if(/지필|고사|정기\s*시험|중간\s*평가|기말/.test(nm)&&!/모의|대비/.test(nm)){(examDays[nm]=examDays[nm]||[]).push(k);return}
    evs.push({s:k,e:k,label:nm,kind:isHol?'hol':'event',block:isHol})});
  const exams=Object.entries(examDays).map(([nm,ds])=>{ds.sort();return {type:'exam',title:nm,start:ds[0],end:ds[ds.length-1],classes:'all',noClass:true,fromId:null,toId:null,note:''}});
  return {evs,exams}}

/* ---- 저장·실행 취소 ---- */
const curSub=()=>STORE.subjects.find(x=>x.id===STORE.cur);
function persist(){try{const cs=curSub();if(cs)cs.db=DB;localStorage.setItem(SUBK,JSON.stringify({subjects:STORE.subjects,cur:STORE.cur,log:LOG.slice(-300),alg:ALGS}));SAVE={ok:true,t:stamp()}}catch(e){SAVE={ok:false,t:stamp()}}}
function persistNeis(){try{localStorage.setItem(NEISK,JSON.stringify(NEIS));localStorage.setItem(MEALK,JSON.stringify(MEALS))}catch(e){}}
function logAdd(label,refs){LOG.push({t:stamp(),label,refs:refs||[]});if(LOG.length>300)LOG.shift()}
function boot(){try{const u=JSON.parse(localStorage.getItem('jindokkae.ui')||'{}');if(u.tpW>=120&&u.tpW<=560)U.tpW=u.tpW}catch(e){}
  let j=null,old=null;try{j=JSON.parse(localStorage.getItem(SUBK)||'null')}catch(e){}
  if(j&&Array.isArray(j.subjects)&&j.subjects.length&&j.subjects.every(x=>x&&x.id&&validDB(x.db))){STORE={subjects:j.subjects,cur:j.subjects.some(x=>x.id===j.cur)?j.cur:j.subjects[0].id};LOG=j.log||[];ALGS=j.alg||[];SAVE={ok:true,t:'불러옴'}}
  else{try{old=JSON.parse(localStorage.getItem(LSK)||'null')}catch(e){}
    const sub={id:uid('s'),name:'내 교과',db:old&&validDB(old.db)?old.db:emptyDB()};if(old&&validDB(old.db)){LOG=old.log||[];ALGS=old.alg||[]}
    STORE={subjects:[sub],cur:sub.id}}
  DB=curSub().db;persist();
  try{NEIS={...NEIS,...JSON.parse(localStorage.getItem(NEISK)||'{}')};MEALS=JSON.parse(localStorage.getItem(MEALK)||'{}')}catch(e){}
  if(!U.sheetClass&&DB.classes[0])U.sheetClass=DB.classes[0].id}
function mutate(label,fn,opt={}){
  const snap=JSON.stringify(DB);const r=fn(DB);if(r===false)return false;
  const last=UNDO[UNDO.length-1],merged=opt.co&&last&&last.co===opt.co&&Date.now()-last.t<8000;
  if(merged)last.t=Date.now();else{UNDO.push({label,snap,co:opt.co,t:Date.now()});if(UNDO.length>80)UNDO.shift();logAdd(label,opt.refs)}REDO=[];persist();
  if(opt.norender){SCH=buildSched(DB);refreshChrome();return true}
  U.flash=opt.flash||null;closeM();refreshDraft();render();if(!opt.silent)toast(opt.msg||label,{undo:true,paw:opt.paw});return true}
function useSub(id){if(id===STORE.cur||!STORE.subjects.some(x=>x.id===id))return;HIST[STORE.cur]={U:UNDO,R:REDO};persist();STORE.cur=id;DB=curSub().db;const h=HIST[id];UNDO=h?h.U:[];REDO=h?h.R:[];
  U.selCell=U.draft=U.selRow=null;U.cOpen.clear();U.sheetClass=DB.classes[0]?.id||null;U.abs=U.mv=U.ttEdit=U.sess=U.av=U.ni=null;persist();closeM();render()}
function quick(fn){fn(DB);persist();render()}
function undo(){const u=UNDO.pop();if(!u){toast('되돌릴 작업이 없어요.');return}
  REDO.push({label:u.label,snap:JSON.stringify(DB)});DB=JSON.parse(u.snap);logAdd('실행 취소: '+u.label);persist();closeM();refreshDraft();render();toast('되돌렸어요: '+u.label,{redo:true})}
function redo(){const r=REDO.pop();if(!r){toast('다시 실행할 작업이 없어요.');return}
  UNDO.push({label:r.label,snap:JSON.stringify(DB)});DB=JSON.parse(r.snap);logAdd('다시 실행: '+r.label);persist();closeM();refreshDraft();render();toast('다시 실행했어요: '+r.label,{undo:true})}

function subjTabs(){return `<div class="stabs" role="tablist" aria-label="교과 시트">${STORE.subjects.map(x=>`<span class="stab ${x.id===STORE.cur?'on':''}"><button role="tab" data-a="subj" data-x="${x.id}" aria-selected="${x.id===STORE.cur}">${esc(x.name)}</button>${x.id===STORE.cur?`<button class="sm" data-a="subjmenu" data-x="${x.id}" aria-label="교과 이름 바꾸기·삭제" title="이름 바꾸기·삭제">⋯</button>`:''}</span>`).join('')}<button class="stab add" data-a="subjadd">+ 교과 추가</button></div>`}
function openSubject(id){const sb=id?STORE.subjects.find(x=>x.id===id):null;

  <input type="hidden" id="sjId" value="${sb?sb.id:''}"><label class="field">교과 이름<input id="sjName" class="inp" autofocus maxlength="20" value="${sb?esc(sb.name):''}" placeholder="예: 한국사, 통합사회"></label>
  <div class="acts">${sb?`<button type="button" class="btn bad" data-a="subjdel" data-x="${sb.id}" ${STORE.subjects.length<2?'disabled title="마지막 교과는 지울 수 없어요"':''}>이 교과 삭제</button>`:''}<span style="flex:1"></span><button type="button" class="btn" data-a="close">취소</button><button class="btn pri">${sb?'저장':'만들기'}</button></div></form>`)}

  $('#nav').innerHTML=VIEWS.map(([v,l])=>`<button data-a="go" data-x="${v}" ${U.view===v?'aria-current="page"':''}>${ic(v)}<span>${l}</span>${v==='cal'&&pend?`<span class="badge">${pend}</span>`:''}</button>`).join('');
  $('#savebox').innerHTML=`<span class="st ${SAVE.ok?'':'bad'}"><i></i>${SAVE.ok?'이 브라우저에 저장됨':'저장 실패'}</span><span class="mono">${esc(SAVE.t)}</span><span>다른 기기와는 동기화되지 않아요.</span>`;

function render(){

const ready=()=>({cls:DB.classes.length>0,les:DB.lessons.length>0,tt:ttFor(DB,TK).length>0||DB.tt.some(t=>t.slots.length)});

function setupCard(){const r=ready();if(r.cls&&r.les&&r.tt)return '';
  const st=(ok,n,t,d,a,x,b)=>`<div class="step ${ok?'ok':''}"><span class="num">${ok?'완료':'단계 '+n}</span><b>${t}</b><span class="muted" style="font-size:12px">${d}</span>${ok?'':`<button class="btn sm pri" data-a="${a}" data-x="${x||''}" style="align-self:flex-start">${b}</button>`}</div>`;
  return `<div class="card" style="margin-bottom:16px"><h2>${jd(30)} 진도깨 시작하기 <span class="sub">세 단계만 입력하면 오늘 수업과 예정 진도가 자동으로 계산돼요</span></h2><div class="steps">
   ${st(r.cls,1,'학급 추가','2-1, 2-3처럼 수업하는 반과 교과부장을 적어요.','addclass','','학급 추가')}
   ${st(r.les,2,'차시 입력','진도표에 수업 주제·내용·비고를 적어요. 엑셀에서 복사해 붙여넣어도 돼요.','go','sheet','진도표 열기')}
   ${st(r.tt,3,'시간표 입력','요일·교시마다 어느 반 수업인지 고르면 날짜별 수업이 만들어져요.','ttedit','','시간표 입력')}</div>
   <p class="note" style="margin-top:10px">급식과 학사일정은 설정에서 NEIS 인증키를 넣으면 불러올 수 있어요.</p></div>`}
function vHome(){
  const tday=SCH.by[TK]||[];
  const act=tday.filter(s=>['plan','check','done'].includes(s.status));
  const done=act.filter(s=>s.status==='done'),plan=act.filter(s=>s.status==='plan');
  const off=tday.filter(s=>s.status==='absent'||s.status==='moved');
  const checks=[];for(let i=21;i>=0;i--){(SCH.by[addK(TK,-i)]||[]).forEach(s=>{if(s.status==='check')checks.push(s)})}
  const pend=DB.inbox.filter(i=>i.state==='pending'),conf=SCH.conflicts;
  const focus=plan[0],rest=plan.slice(1);
  let say;
  if(!DB.classes.length)say='반가워요! 먼저 <b>학급</b>부터 알려 주세요.';
  else if(checks.length)say=`기록하지 않은 수업이 <b>${checks.length}개</b> 있어요. 먼저 확인해 주세요.`;
  else if(focus)say=`다음은 <b>${focus.p}교시 ${esc(cn(focus.c))}</b> ${focus.n}차시예요.${pend.length?` 시간표 변경도 ${pend.length}건 확인이 필요해요.`:''}`;
  else if(act.length)say='오늘 수업을 <b>모두 깨부쉈어요!</b> 수고 많았어요.';
  else say='오늘은 수업이 없어요.';
  const absToday=off.filter(s=>s.status==='absent').length;
  const sum=DB.classes.length?`<div class="sumbar">
    <div class="sum"><span>오늘 수업</span><b class="mono">${act.length}</b></div>
    <div class="sum"><span>완료</span><b class="mono" style="color:var(--ok)">${done.length}</b></div>
    <div class="sum"><span>예정</span><b class="mono" style="color:var(--accent)">${plan.length}</b></div>
    <button class="sum ${pend.length?'alert':''}" data-a="go" data-x="tt"><span>시간표 변경 확인</span><b class="mono">${pend.length}</b></button>
    <button class="sum ${conf.length||absToday?'warn':''}" data-a="go" data-x="tt"><span>오늘 결손 · 일정 충돌</span><b class="mono">${absToday} · ${conf.length}</b></button></div>`:'';
  const alerts=(conf.length||checks.length)?`<div class="card" style="margin-bottom:16px;border-color:var(--warn)"><h2>확인이 필요해요</h2><div class="dlist">
    ${conf.map(x=>`<div class="row check" style="--cc:${ccv(x.c)}"><span class="pp mono">${md(x.date)}</span><span class="bar"></span><span class="ls"><b>${esc(cn(x.c))} ${x.n}차시 완료 기록</b><small>이날 ${esc(cn(x.c))} 수업 칸이 없어요(결손·이동). 기록 날짜를 확인하세요.</small></span><span class="acts"><button class="btn sm" data-a="day" data-x="${x.date}">일정 보기</button><button class="btn sm pri" data-a="cell" data-x="${x.c}|${x.n}">기록 확인</button></span></div>`).join('')}
    ${checks.map(s=>rowHtml(s,'check')).join('')}</div></div>`:'';
  let focusHtml='';
  if(focus){const les=L(focus.n),prev=rec(DB,focus.c,focus.n-1),cur=rec(DB,focus.c,focus.n),c=cobj(focus.c);
    focusHtml=`<div class="focus" style="--cc:${ccv(focus.c)}"><div class="when"><span class="p">${focus.p}교시</span><span class="tm mono">${PT(focus.p)}</span><span class="st">${isNow(DB,TK,focus.p)?'지금 수업 중':'다음 수업'}</span></div>
    <div class="body"><div class="cls"><b>${esc(c.name)}</b>${c.lead?`부장 ${esc(c.lead)}`:''}${focus.movedIn?`<span class="tag gray">${sic('moved',11)} ${focus.from.p}교시에서 이동</span>`:''}</div>
      <div class="ttl">${focus.n}차시 · ${esc(lname(focus.n))}</div>
      <dl class="info">${les?.pages?`<div><dt>교과서</dt><dd>p.${esc(les.pages)}</dd></div>`:''}${les?.content?`<div><dt>수업 내용</dt><dd>${esc(les.content)}</dd></div>`:''}${les?.materials?`<div><dt>준비물</dt><dd>${esc(les.materials)}</dd></div>`:''}${les?.note?`<div><dt>비고</dt><dd style="color:var(--warn);font-weight:600">${esc(les.note)}</dd></div>`:''}${prev?.memo?`<div><dt>지난 시간</dt><dd>${esc(prev.memo)} <span class="muted mono">(${mdw(prev.date)})</span></dd></div>`:''}${cur?.memo?`<div><dt>메모</dt><dd>${esc(cur.memo)}</dd></div>`:''}</dl>
      <div class="acts"><button class="btn pri lg" data-a="done" data-x="${focus.key}">${paw(16)} 수업 완료</button><button class="btn" data-a="cell" data-x="${focus.c}|${focus.n}">진도 확인</button><button class="btn" data-a="memo" data-x="${focus.c}|${focus.n}">메모</button><button class="btn" data-a="day" data-x="${TK}">일정 확인</button><button class="btn bad" data-a="absence" data-x="${focus.key}">결손 처리</button></div></div></div>`;
  }else if(!checks.length&&DB.classes.length){let k=TK,s=[];for(let i=1;i<21&&!s.length;i++){k=addK(TK,i);s=(SCH.by[k]||[]).filter(x=>x.status==='plan')}
    if(s[0])focusHtml=`<div class="card"><h2>다음 수업일 <span class="sub">${mdw(k)}</span><span class="right"><button class="btn sm" data-a="day" data-x="${k}">일정 보기</button></span></h2><p style="margin:0"><b>${s[0].p}교시 ${esc(cn(s[0].c))}</b> · ${s[0].n}차시 ${esc(lname(s[0].n))} <span class="muted">외 ${s.length-1}개 수업</span></p></div>`}
  const lists=(rest.length?`<div class="sect">이후 수업</div>${rest.map(s=>rowHtml(s,'plan')).join('')}`:'')+
    (off.length?`<div class="sect" style="color:var(--bad)">오늘 빠진 수업</div>${off.map(s=>rowHtml(s,s.status)).join('')}`:'')+
    (done.length?`<div class="sect" style="color:var(--ok)">${paw(13)} 끝난 수업</div>${done.map(s=>rowHtml(s,'done')).join('')}`:'');
  const auto=plan.map(s=>{const l=L(s.n);return l&&(l.note||l.materials)?{t:`${cn(s.c)}: ${[l.materials,l.note].filter(Boolean).join(' / ')}`}:null}).filter(Boolean);
  const todos=DB.todos.map((t,i)=>({...t,i})).filter(t=>!t.date||t.date===TK);
  const lead=DB.classes.length?Math.max(...DB.classes.map(c=>SCH.nextN[c.id]-1)):0;
  const ups=DB.assess.filter(a=>(a.end||a.start)>=TK).sort((a,b)=>a.start<b.start?-1:1).slice(0,4);
  return topbar('홈')+`<div class="speak ${sayPop('home',say)}">${jd(104)}<div class="bub" aria-live="polite">${say}</div></div>${setupCard()}${alerts}
  <div class="grid homegrid"><div style="min-width:0">${focusHtml}${lists}</div>
  <div class="stack">
    <div class="card"><h2>오늘 할 일</h2><ul class="todo">${auto.map(t=>`<li><span class="tag warn">진도표</span><span>${esc(t.t)}</span></li>`).join('')}
      ${todos.map(t=>`<li class="${t.d?'d':''}"><input type="checkbox" id="td${t.i}" data-todo="${t.i}" ${t.d?'checked':''}><label for="td${t.i}">${esc(t.t)}</label></li>`).join('')}</ul>
      <form id="todoForm" style="display:flex;gap:6px;margin-top:10px"><input id="todoIn" class="inp" placeholder="할 일 추가" aria-label="할 일 추가"><button class="btn sm">추가</button></form></div>
    ${ups.length?`<div class="card"><h2>다가오는 평가 <span class="right"><button class="btn sm" data-a="avnew">평가 추가</button></span></h2><div class="dlist">${ups.map(achip).join('')}</div></div>`:''}
    ${DB.classes.length&&DB.lessons.length?`<div class="card"><h2>반별 진도 <span class="right"><button class="btn sm" data-a="go" data-x="sheet">진도표</button></span></h2><div class="mini">${DB.classes.map(c=>{const d=SCH.nextN[c.id]-1;return `<div style="--cc:${ccv(c.id)}"><b>${esc(c.name)}</b><span class="tr"><i style="width:${d/DB.lessons.length*100}%"></i></span><span class="mono" style="font-size:12px">${d}차시 ${d===lead?'<span class="tag ok">선두</span>':`<span class="tag ${lead-d>=2?'warn':'gray'}">-${lead-d}</span>`}</span></div>`}).join('')}</div></div>`:''}
    ${mealCard()}
  </div></div>`;
}
function rowHtml(s,kind){const n=s.n||SCH.nextN[s.c];
  const acts={done:`<span class="stamp">${paw(16)} 완료</span><button class="btn sm" data-a="uncomplete" data-x="${s.c}|${s.n}">완료 취소</button>`,
    plan:`<button class="btn sm" data-a="memo" data-x="${s.c}|${n}">메모</button><button class="btn sm" data-a="sess" data-x="${s.key}">일정</button><button class="btn sm pri" data-a="done" data-x="${s.key}">완료</button>`,
    check:`<span class="tag warn">기록 없음</span><button class="btn sm" data-a="absence" data-x="${s.key}">결손이었어요</button><button class="btn sm pri" data-a="done" data-x="${s.key}">수업했어요</button>`,
    absent:`${stag('absent')}<button class="btn sm" data-a="sess" data-x="${s.key}">복구</button>`,
    moved:`${stag('moved')}<button class="btn sm" data-a="sess" data-x="${s.key}">자세히</button>`}[kind];
  const sub=kind==='check'?`${mdw(s.date)} 수업 기록이 없어요 · 다음 차시 ${n}차시`:kind==='absent'?`${esc(excOf(s)?.reason||'')} ${esc(excOf(s)?.note||'')}`:kind==='moved'?moveDest(s):esc(lname(n));
  return `<div class="row ${kind} ${U.flash===s.c+'|'+s.n?'justdone':''}" style="--cc:${ccv(s.c)}"><span class="pp mono">${kind==='check'?md(s.date)+' ':''}${s.p}교시<small>${PT(s.p)}</small></span><span class="bar"></span>
  <span class="ls"><b>${esc(cn(s.c))}${kind==='absent'||kind==='moved'?'':` · ${n}차시`}</b><small>${sub}</small></span><span class="acts">${acts}</span></div>`}
const excOf=s=>DB.exc.find(e=>e.id===(s.excId||s.movedIn));
function moveDest(s){const e=excOf(s);return e?`${mdw(e.toDate)} ${e.toP}교시로 이동 · ${esc(e.note||e.reason)}`:''}
function achip(a){const d=dday(a.start),past=(a.end||a.start)<TK;const tg=a.classes==='all'?'전체 학급':a.classes.map(cn).join(', ');
  const rng=a.type==='exam'&&(a.fromId||a.toId)?` · 범위 ${lessonIdx(DB,a.fromId)||'?'}~${lessonIdx(DB,a.toId)||'?'}차시`:a.lessonId?` · ${lessonIdx(DB,a.lessonId)}차시`:'';
  return `<button class="achip ${a.type} ${past?'past':''}" data-a="avedit" data-x="${a.id}"><b>${past?'지남':d<=0?'진행 중':'D-'+d}</b><span>${esc(a.title)} <span class="muted">${md(a.start)}${a.end&&a.end!==a.start?'~'+md(a.end):''} · ${esc(tg)}${rng}</span></span></button>`}
function mealCard(){const m=MEALS[TK];
  return `<div class="card"><div class="mealhead">${bab(48)}<div><b>밥숑의 오늘 급식</b><div class="muted" style="font-size:12px">${NEIS.school?esc(NEIS.school.name):'학교 미설정'}</div></div><button class="btn sm" style="margin-left:auto" data-a="go" data-x="meal">이번 주</button></div>
  ${m?mealList(m):NEIS.key&&NEIS.school?`<p class="muted" style="margin:0">${U.neis.busy?'불러오는 중…':'아직 불러오지 않았어요.'}</p>`:`<p class="muted" style="margin:0 0 8px">설정에서 NEIS 인증키와 학교를 등록하면 급식이 보여요.</p><button class="btn sm" data-a="go" data-x="set">NEIS 연결하기</button>`}</div>`}
const mealList=m=>!m.items.length?'<p class="muted" style="margin:0">급식이 없는 날이에요.</p>':`<div class="meal"><ul>${m.items.map(it=>{const hit=it.alg&&it.alg.split('.').some(x=>ALGS.includes(x));return `<li><span style="${hit?'color:var(--bad);font-weight:700':''}">${esc(it.name)}${hit?' · 알레르기':''}</span><span class="mono">${esc(it.alg)}</span></li>`}).join('')}</ul></div>${m.cal?`<p class="muted" style="font-size:11px;margin:6px 0 0">${esc(m.cal)}</p>`:''}`;

    if(mode==='after'&&!s&&k===i.date&&p===i.p&&(base.by[k]||[]).some(x=>x.p===p&&x.c===i.c))return `<td class="gone">${esc(cn(i.c))}</td>`;

/* ---------- NEIS ---------- */
const ymd=k=>k.replace(/-/g,'');
async function neis(svc,params){if(!NEIS.key)throw {msg:'인증키를 먼저 저장하세요.'};
  const q=new URLSearchParams({KEY:NEIS.key,Type:'json',pIndex:'1',pSize:'1000',...params});
  const url=`https://open.neis.go.kr/hub/${svc}?${q}`;let r;
  try{r=await fetch(NEIS.proxy?NEIS.proxy+encodeURIComponent(url):url)}catch(e){throw {msg:'NEIS에 연결하지 못했어요. 인터넷 연결을 확인하세요. 미리보기 화면처럼 외부 연결이 막힌 곳에서는 동작하지 않아요. 웹에 올린 앱(GitHub Pages 등)에서 다시 시도하고, 그래도 안 되면 설정의 프록시 주소를 쓰세요.'}}
  if(!r.ok)throw {msg:`NEIS 응답 오류 (${r.status}). 잠시 뒤 다시 시도하세요.`};
  let j;try{j=await r.json()}catch(e){throw {msg:'NEIS 응답을 읽지 못했어요. 프록시 주소가 맞는지 확인하세요.'}}
  if(j.RESULT){if(j.RESULT.CODE==='INFO-200')return [];throw {msg:neisErr(j.RESULT)}}
  const arr=j[svc];if(!arr)return [];const res=(arr[0].head||[]).find(h=>h.RESULT)?.RESULT;
  if(res&&res.CODE!=='INFO-000')throw {msg:neisErr(res)};return (arr[1]&&arr[1].row)||[]}
function neisErr(r){if(/290|INFO-300/.test(r.CODE))return '인증키가 올바르지 않아요. NEIS에서 발급한 키를 다시 붙여넣으세요.';return `NEIS: ${r.MESSAGE||r.CODE}`}

async function loadMeals(mon,force){if(!NEIS.key||!NEIS.school)return;U.neis.busy=true;render();

  if(tg.id==='acNames'&&tg.value.trim()){acAdd(tg.value);tg.value=''}

document.addEventListener('input',e=>{const tg=e.target;
  if(tg.id==='acNames'){const v=tg.value;if(/[,，\s]/.test(v)){const parts=v.split(/[,，\s]/),rest=parts.pop();acAdd(parts.join(','));tg.value=rest}return}
  if(tg.classList.contains('ie')&&tg.tagName==='TEXTAREA')autosize(tg);
  if(U.abs&&tg.id==='absNote'){U.abs.note=tg.value;return}
  if(U.abs&&tg.dataset.abs){tg.checked?U.abs.keys.add(tg.dataset.abs):U.abs.keys.delete(tg.dataset.abs);drawAbsence();return}
  if(U.abs&&tg.id==='absRev'){U.abs.revert=tg.checked;drawAbsence();return}

    $('#mvPv').innerHTML=mvPv();$('#mvGo').disabled=!!mvCheck().err;return}
  if(U.ttEdit&&(tg.dataset.tts||tg.id==='ttFrom')){const T=U.ttEdit;

    const diff=ttEditDiff();$('#ttDiff').innerHTML=diff?`적용하면 시작일부터 4주 안에 <b>${diff}일</b>의 수업 칸이 바뀌어요.`:'지금 시간표와 같아요.';return}
  if(!U.draft)return;
  if(tg.id==='pMemo'){U.draft.memo=tg.value;schedCommit();return}
  if(tg.id==='pActual'){U.draft.actual=tg.value;schedCommit();return}
  if(tg.dataset.oth){tg.checked?U.draft.others.add(tg.dataset.oth):U.draft.others.delete(tg.dataset.oth);
    document.querySelectorAll('.cell.also').forEach(x=>x.classList.remove('also'));U.draft.others.forEach(id=>{const el=document.querySelector(`.cell[data-x="${id}|${U.selCell.n}"]`);if(el)el.classList.add('also')});commitDraft(false)}
});

document.addEventListener('paste',e=>{const tg=e.target;if(!tg.dataset||!tg.dataset.lf||!LESSON_FIELDS.includes(tg.dataset.lf))return;
  const txt=(e.clipboardData||window.clipboardData).getData('text');if(!txt||!/[\t\n]/.test(txt.replace(/\r?\n$/,'')))return;
  e.preventDefault();const rows=parseTable(txt);const n=+tg.dataset.n;
  mutate(`붙여넣기: ${n}차시부터 ${rows.length}행`,db=>{C.pasteGrid(db,n,tg.dataset.lf,rows)},{msg:`${rows.length}개 차시에 붙여넣었어요.`})});
function parseTable(txt){const rows=[];let row=[],cell='',q=false;txt=txt.replace(/\r\n?/g,'\n');
  for(let i=0;i<txt.length;i++){const ch=txt[i];if(q){if(ch==='"'&&txt[i+1]==='"'){cell+='"';i++}else if(ch==='"')q=false;else cell+=ch}
    else if(ch==='"'&&cell==='')q=true;else if(ch==='\t'){row.push(cell);cell=''}else if(ch==='\n'){row.push(cell);rows.push(row);row=[];cell=''}else cell+=ch}
  if(cell!==''||row.length){row.push(cell);rows.push(row)}return rows.filter(r=>r.some(v=>v.trim()))}
document.addEventListener('pointerdown',e=>{const h=e.target.closest&&e.target.closest('[data-rz]');if(!h)return;e.preventDefault();
  const tb=h.closest('table.sheet'),th=h.closest('th'),x0=e.clientX,w0=th.getBoundingClientRect().width;try{h.setPointerCapture(e.pointerId)}catch(_){}
  const mv=ev=>{const w=Math.max(120,Math.min(560,w0+ev.clientX-x0));tb.style.setProperty('--tpw',w+'px');U.tpW=Math.round(w)};
  const up=()=>{h.removeEventListener('pointermove',mv);h.removeEventListener('pointerup',up);try{localStorage.setItem('jindokkae.ui',JSON.stringify({tpW:U.tpW}))}catch(_){}};
  h.addEventListener('pointermove',mv);h.addEventListener('pointerup',up)});
document.addEventListener('dblclick',e=>{const h=e.target.closest&&e.target.closest('[data-rz]');if(!h)return;U.tpW=170;h.closest('table.sheet').style.setProperty('--tpw','170px');try{localStorage.setItem('jindokkae.ui',JSON.stringify({tpW:170}))}catch(_){}});
document.addEventListener('submit',e=>{e.preventDefault();const id=e.target.id;
  if(id==='subjForm'){const nm=$('#sjName').value.trim(),sid=$('#sjId').value;if(!nm){toast('교과 이름을 적어 주세요.');return}
    if(STORE.subjects.some(k=>k.name===nm&&k.id!==sid)){toast('같은 이름의 교과가 이미 있어요.');return}
    if(sid){STORE.subjects.find(k=>k.id===sid).name=nm;persist();closeM();render();toast('교과 이름을 바꿨어요.')}
    else{const d=emptyDB();d.term=clone(DB.term);d.periods=clone(DB.periods);d.trackFrom=DB.trackFrom;d.tt=[{from:d.term.start,slots:[]}];d.events=clone(DB.events);
      const sb={id:uid('s'),name:nm,db:d};STORE.subjects.push(sb);useSub(sb.id);U.view='sheet';render();toast(`'${nm}' 시트를 만들었어요. 학급부터 추가해 보세요.`)}return}
  if(id==='todoForm'){const v=$('#todoIn').value.trim();if(v)quick(db=>db.todos.push({t:v,d:false,date:TK}))}
  if(id==='calTodo'){const v=$('#ctIn').value.trim();if(v)quick(db=>db.todos.push({t:v,d:false,date:U.sel}))}
  if(id==='addClassForm'){acAdd($('#acNames').value);$('#acNames').value='';const names=U.acTags.slice(),lead=$('#acLead').value.trim();
    if(!names.length){toast('학급 이름을 적어 주세요. 예: 2-1');return}
    const dup=names.filter(nm=>DB.classes.some(c=>c.name===nm));
    mutate(`학급 추가: ${names.join(', ')}`,db=>{names.forEach(nm=>C.addClass(db,nm,names.length===1?lead:''))},{msg:`${names.length}개 학급을 추가했어요.${dup.length?` (${dup.join(', ')}은 이미 있던 이름이에요)`:''}`});
    if(!U.sheetClass&&DB.classes[0])U.sheetClass=DB.classes[0].id}
  if(id==='pasteForm'){const rows=parseTable($('#pasteTa').value);if(!rows.length){toast('붙여넣은 내용이 없어요.');return}
    const start=DB.lessons.length+1;mutate(`엑셀에서 차시 ${rows.length}개 만들기`,db=>{C.pasteGrid(db,start,'topic',rows)},{msg:`${rows.length}개 차시를 만들었어요.`})}
  if(id==='evForm'){const v=$('#evT').value.trim(),kind=$('#evK').value,k=U.sel;if(!v)return;
    const act=(SCH.by[k]||[]).filter(s=>['plan','check','done'].includes(s.status));
    mutate(`일정 추가: ${md(k)} ${v}`,db=>C.addEvent(db,{s:k,e:k,label:v,kind,block:kind==='hol',src:'직접'}),{msg:kind==='hol'&&act.length?`휴업일로 추가해서 이날 수업 ${act.length}개를 빼고 다시 계산했어요.`:'일정을 추가했어요.'});
    if(kind==='event'&&act.length)openAbsence(k,[],'학교 행사',`'${esc(v)}' 일정을 추가했어요. 이 일정 때문에 빠지는 수업이 있으면 골라 주세요. 고르지 않고 닫으면 수업은 그대로예요.`)}
  if(id==='memoForm'){const [c,n]=$('#mKey').value.split('|');const v=rec(DB,c,+n),memo=$('#mMemo').value.trim();
    if((v?.memo||'')===memo){closeM();return}
    mutate(`${cn(c)} ${n}차시 메모 저장`,db=>C.setRecord(db,c,+n,v?{...v,memo}:(memo?{done:false,date:'',memo,actual:''}:null)),{refs:[lref(c,+n)]})}
});
document.addEventListener('keydown',e=>{const tg=e.target;
  if(tg.id==='acNames'&&!e.isComposing){if(e.key==='Enter'){e.preventDefault();acAdd(tg.value);tg.value='';return}if(e.key==='Backspace'&&!tg.value&&U.acTags.length){U.acTags.pop();acDraw();return}}
  if(e.key==='Escape'){if($('#layer').innerHTML)closeM();else if((U.selCell||U.selRow)&&U.view==='sheet'){U.selCell=null;U.draft=null;U.selRow=null;render()}return}
  /* 표 입력칸: Enter = 아래 칸, Shift+Enter = 줄바꿈 */
  if(tg.classList&&tg.classList.contains('ie')&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&e.keyCode!==229){e.preventDefault();
    if(tg.dataset.lf){const nx=document.querySelector(`.ie[data-lf="${tg.dataset.lf}"][data-n="${+tg.dataset.n+1}"]`);if(nx){nx.focus();nx.select&&nx.select()}else tg.blur()}else tg.blur();return}
  const inField=tg.matches('input,textarea,select');
  if((e.ctrlKey||e.metaKey)&&!inField&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();return}
  if((e.ctrlKey||e.metaKey)&&!inField&&e.key.toLowerCase()==='y'){e.preventDefault();redo();return}
  if(e.key==='Enter'&&tg.matches('td.cell,.crow')){e.preventDefault();tg.click()}});
