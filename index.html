<style>
/* Layout: 왼쪽 레일 + 작업 영역. 홈 = 가장 가까운 수업 하나를 크게, 진도표 = 엑셀 격자 + 우측 편집 패널 */
:root{
  --bg:#EDF2FA; --surface:#FFFFFF; --surface-2:#F4F7FC; --line:#DAE2F0; --line-2:#C7D3E8;
  --fg:#1A2440; --muted:#5D6984; --accent:#2D66E0; --accent-ink:#FFFFFF; --accent-soft:#E1EAFC;
  --fur:#D98E3E; --ok:#1C9466; --ok-soft:#DDF3EA; --warn:#B86E0C; --warn-soft:#FCEFD9; --bad:#CF4339; --bad-soft:#FBE3E1;
  --c1:#8DA4EA; --c2:#F08A4B; --c3:#F2C230; --c4:#7ED1B8; --c5:#C59BE8; --c6:#F28CA8; --c7:#9BC96A; --c8:#A6ADBA; --c9:#5FC4E0; --c10:#C9A27A;
  --p1:#4C7DF0; --p2:#E8833A; --p3:#2FA874; --p4:#9B6BE0; --p5:#E2588F; --p6:#1FA2B8;
   --sheet:#FFF8DC; --zebra:#F7F9FD; --hover:#EEF3FF; --exam:#2D66E0;
  --f-body:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-display:var(--f-body);
  --f-mono:var(--f-body);
  --paw-off:#C9D0DE; --doing:#E5A512;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1424; --surface:#161F35; --surface-2:#1B2640; --line:#28355a; --line-2:#334366;
  --fg:#E5EBF8; --muted:#97A4C0; --accent:#6C98FF; --accent-ink:#0E1424; --accent-soft:#1D2E56;
  --ok:#3CC48E; --ok-soft:#173A2F; --warn:#E8A94A; --warn-soft:#3A2E17; --bad:#F07068; --bad-soft:#3E1D1D;
  --sheet:#25251a; --zebra:#182238; --hover:#1E2B4A; --exam:#6C98FF; --paw-off:#46537A; --doing:#F2BE4B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1424; --surface:#161F35; --surface-2:#1B2640; --line:#28355a; --line-2:#334366;
  --fg:#E5EBF8; --muted:#97A4C0; --accent:#6C98FF; --accent-ink:#0E1424; --accent-soft:#1D2E56;
  --ok:#3CC48E; --ok-soft:#173A2F; --warn:#E8A94A; --warn-soft:#3A2E17; --bad:#F07068; --bad-soft:#3E1D1D;
  --sheet:#25251a; --zebra:#182238; --hover:#1E2B4A; --exam:#6C98FF; --paw-off:#46537A; --doing:#F2BE4B; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.6;letter-spacing:-.005em;word-break:keep-all;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:208px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;padding:20px 12px;display:flex;flex-direction:column;gap:16px;border-right:1px solid var(--line);background:var(--surface);padding-left:max(12px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:6px;padding:0 4px}
.brand b{font-family:'Jua','Noto Sans KR',sans-serif;font-size:28px;font-weight:400;letter-spacing:0;color:var(--accent)}
.brandimg{display:block;width:46px;height:46px;object-fit:contain}
.brand small{display:block;font-size:11px;color:var(--muted);line-height:1.35}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 12px;border-radius:10px;text-align:left;color:var(--muted);font-weight:500;position:relative}
.nav button svg{width:18px;height:18px;flex:none}
.nav button:hover{background:var(--surface-2);color:var(--fg)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.nav .badge{margin-left:auto;background:var(--bad);color:#fff;font-size:10px;font-weight:700;border-radius:99px;padding:0 6px;line-height:16px}
.inst{margin:0 0 8px;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.railbot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.helpbtn{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:600;color:var(--muted);text-align:left}
.helpbtn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.helpbtn svg{flex:none}
.hello{display:flex;align-items:center;gap:8px;justify-content:center;text-align:center;background:linear-gradient(120deg,var(--accent-soft),var(--surface));border:1px solid var(--line);border-radius:12px;padding:12px 10px;font-weight:700;font-size:12.5px;line-height:1.45;color:var(--accent)}
.hello svg{flex:none}
.hello .pals{display:inline-flex;flex:none}.hello .pals img{width:36px;height:36px;object-fit:contain;display:block}.hello .pals img+img{margin-left:-10px}
.savechip{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);padding:0 4px;white-space:nowrap}
.savechip i{width:6px;height:6px;border-radius:50%;background:var(--ok);display:inline-block}
.savechip.bad{color:var(--bad);font-weight:700}.savechip.bad i{background:var(--bad)}
.jd{display:block;flex:none;object-fit:contain}
main{padding-block:20px 48px;padding-left:max(16px,2vw);padding-right:max(16px,2vw,env(safe-area-inset-right,0px));min-width:0}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.top h1{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:-.02em;margin:0}
.top .meta{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 11px;font-size:12px;color:var(--muted);white-space:nowrap}
.chip.hot{border-color:transparent;background:var(--accent);color:var(--accent-ink);font-weight:700}
button.chip{cursor:pointer}
button.chip[aria-pressed="false"]{opacity:.55;text-decoration:line-through}
button.chip.ttf[aria-pressed="false"]{opacity:1;text-decoration:none}

/* 일정 칸 공통 */

.row{display:grid;grid-template-columns:70px 6px minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 12px}

.stamp{color:var(--ok);display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:12px}
.blink{animation:blinkb .9s ease-in-out 1;position:relative}@keyframes blinkb{0%,100%{box-shadow:inset 0 0 0 0 transparent}50%{box-shadow:inset 0 0 0 1.5px var(--warn)}}

.sheetbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}

.ie{display:block;width:100%;border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 6px;font-size:13px;line-height:1.45;color:var(--fg);resize:none;field-sizing:content;min-height:28px;overflow:hidden;font-family:inherit}

.addrow td{background:var(--surface)!important;padding:8px!important}

.psec{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.psec h4{margin:0;font-size:12px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.psec.mine{border-top:3px solid var(--cc)}
.psec.mine h4{color:var(--fg);font-size:13px}
.psec.common{background:var(--surface-2);border:1px dashed var(--line-2);border-radius:12px;padding:12px}
.psec.common h4{color:var(--accent);font-size:13px}
.psec.hist2{gap:8px}.psec.hist2 summary{font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;list-style:none}
.psec.hist2 summary::-webkit-details-marker{display:none}.psec.hist2 summary::before{content:'▸ '}.psec.hist2[open] summary::before{content:'▾ '}
.lcol .pill{width:auto;height:28px;border-radius:99px;padding:0 11px;background:var(--surface);color:var(--muted);font-size:12px;font-weight:600;border:2px solid var(--line-2)}
.lcol .pill[aria-pressed="true"]{border-color:var(--fg);color:var(--fg)}
.others{display:flex;flex-direction:column;gap:4px}
.others label{display:flex;gap:8px;align-items:center;font-size:13px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);color:var(--fg);cursor:pointer}
.others label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.others input{accent-color:var(--accent)}
.others .cur{margin-left:auto;font-size:12px;color:var(--muted);text-align:right}
.pv{border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:13px}
.pv > div{display:grid;grid-template-columns:44px minmax(0,1fr) 14px minmax(0,1fr);gap:6px;padding:6px 10px;align-items:center}
.pv > div.ln{grid-template-columns:minmax(0,1fr)}
.pv > div+div{border-top:1px solid var(--line)}
.pv .b{color:var(--muted);text-decoration:line-through}
.pv .a{font-weight:700;color:var(--accent)}
.pv .w{color:var(--warn)}
.pv .empty{display:block;color:var(--muted);font-size:12px;padding:8px 10px}
.hist{display:flex;flex-direction:column;gap:4px;font-size:12px}
.hist > div{display:flex;gap:8px;align-items:center;color:var(--muted)}
.hist > div span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist time{font-family:var(--f-mono);font-size:11px;flex:none}
.panel-empty{color:var(--muted);font-size:13px;text-align:left;padding:4px 2px;line-height:1.7}
.panel-empty ol{margin:6px 0 0;padding-left:18px}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatches button{width:28px;height:28px;border-radius:50%;border:2px solid transparent;background:var(--sw)}
.swatches button[aria-pressed="true"]{border-color:var(--fg)}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.step{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.step b{font-size:14px}
.step.ok{border-color:var(--ok);background:var(--ok-soft)}
.step .num{font-family:var(--f-mono);font-size:12px;color:var(--muted)}

/* ---- 시간표 ---- */
.ttlay{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}.ttlay.solo{grid-template-columns:minmax(0,900px)}
.alertbar{display:flex;gap:10px;align-items:center;background:var(--bad-soft);border:1px solid var(--bad);color:var(--bad);border-radius:12px;padding:8px 14px;margin-bottom:16px;font-weight:600;flex-wrap:wrap}
.alertbar.w{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.alertbar .btn{margin-left:auto}
.tt-wrap{overflow-x:auto}
table.tt{border-collapse:separate;border-spacing:4px;width:100%;min-width:520px;table-layout:fixed}
.tt th{font-size:12px;color:var(--muted);font-weight:600;padding:2px}
.tt th.today{color:var(--accent)}
.tt td{height:44px;border-radius:8px;background:var(--surface-2);vertical-align:middle;padding:3px}
.tt td .stk{display:flex;flex-direction:column;gap:3px}
.tt td.addable{cursor:pointer}.tt td.addable .plus{display:none;font-size:11px;font-weight:600;color:var(--accent);text-align:center;width:100%}.tt td.addable:hover{background:var(--accent-soft);outline:1px dashed var(--accent)}.tt td.addable:hover .plus{display:block}
.tt td.hol{font-size:11px;color:var(--bad);text-align:center}
table.mtt{border-spacing:3px;min-width:240px}
.mtt td{height:30px;text-align:center;font-weight:700;font-size:11px;padding:1px}
.mtt td.on{background:color-mix(in srgb,var(--cc) 35%,var(--surface))}
.mtt td.hl{outline:2px solid var(--bad);outline-offset:-2px}
.mtt td.gone{background:repeating-linear-gradient(135deg,var(--bad-soft) 0 5px,var(--surface-2) 5px 10px);color:var(--bad);text-decoration:line-through;outline:2px solid var(--bad);outline-offset:-2px}
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.cmp h4{margin:0 0 4px;font-size:12px;color:var(--muted)}
.chg{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.chg+.chg{margin-top:10px}
.chg.new{border-left:5px solid var(--bad)}
.chg .hd{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chg .vs{display:grid;grid-template-columns:minmax(0,1fr) 18px minmax(0,1fr);gap:6px;align-items:center;font-size:13px}
.chg .vs > div{background:var(--surface-2);border-radius:8px;padding:6px 9px}
.chg .vs small{display:block;font-size:10px;color:var(--muted)}
.chg .vs .after{background:var(--accent-soft)}
.chg .vs .after.cancel{background:var(--bad-soft);color:var(--bad)}
.chg .ft{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.chg .ft .gap{margin-left:auto}
.excl{display:flex;flex-direction:column;gap:6px}
.exc{display:grid;grid-template-columns:8px minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px}
.exc .bar{width:6px;height:100%;min-height:30px;border-radius:3px;background:var(--cc)}
.exc small{display:block;color:var(--muted);font-size:12px}
.exc.off{opacity:.6}
.exc.off b{text-decoration:line-through}
.ttedit td{padding:2px}
.ttedit select{width:100%;border:1px solid var(--line-2);border-radius:6px;background:var(--surface);padding:4px;font-size:12px}

/* ---- 캘린더 ---- */
.calbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.calbar .ttl{font-size:16px;font-weight:700;min-width:110px;text-align:center}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.ddays{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.dd{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:13px}
.dd:hover{border-color:var(--accent)}
.dd b{font-family:var(--f-mono);font-size:14px}
.dd.exam b{color:var(--accent)} .dd.task b{color:var(--warn)}
.schedsplit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}.schedsplit>div{min-width:0}
.callay{grid-template-columns:minmax(0,1.7fr) minmax(290px,1fr)}
.calg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.calg .wd{font-size:11px;color:var(--muted);text-align:center;padding:2px;font-weight:600}
.day{min-height:88px;border-radius:10px;background:var(--surface-2);border:1px solid transparent;padding:5px 6px;display:flex;flex-direction:column;gap:3px;text-align:left;min-width:0}
.day:hover{border-color:var(--line-2)}
.day.out{opacity:.35}
.day.sel{border-color:var(--accent);background:var(--accent-soft)}
.day .dn{font-size:12px;font-weight:700}
.day.today .dn{background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:0 7px;align-self:flex-start}
.day.hol .dn{color:var(--bad)}
.ev{font-size:10.5px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:4px;padding:0 4px;max-width:100%}
.ev.hol{color:var(--bad)} .ev.exam{background:var(--accent);color:var(--accent-ink);font-weight:700} .ev.task{background:var(--warn-soft);color:var(--warn);font-weight:700} .ev.event{background:var(--ok-soft);color:var(--ok)}
.pips{display:flex;flex-wrap:wrap;gap:2px}
.pip{font-size:10px;font-weight:700;border-radius:4px;padding:0 4px;line-height:15px;background:var(--cc);color:#1A2440;border:1px solid var(--cc)}
.pip.plan{background:transparent;border:1px dashed var(--cc);color:var(--fg)}
.pip.check{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.pip.absent,.pip.moved{background:transparent;border:1px dashed var(--bad);color:var(--bad);text-decoration:line-through}
.pip.moved{border-color:var(--line-2);color:var(--muted)}
.weekg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.wcol{background:var(--surface-2);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0;border:1px solid transparent;min-height:240px;cursor:pointer}
.wcol.sel{border-color:var(--accent)}
.wcol.today .wh b{background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:0 7px}
.wh{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.wh b{color:var(--fg)}
.dlist{display:flex;flex-direction:column;gap:6px}
.inl{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-end}
.inl .field{flex:1;min-width:90px}

/* ---- 급식 ---- */
.week5{grid-template-columns:repeat(5,minmax(0,1fr))}
.mday.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.mday h3{margin:0 0 8px;font-size:14px;display:flex;gap:6px;align-items:center}
.alg{display:flex;flex-wrap:wrap;gap:6px}
.alg button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:2px 8px;font-size:12px}
.alg button[aria-pressed="true"]{border-color:var(--bad);color:var(--bad);font-weight:700;background:var(--bad-soft)}
.mealhero{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 18px;margin-bottom:16px}
.mealhero .say{font-family:var(--f-display);font-size:20px;font-weight:800}

/* ---- 백업 ---- */
.datalay{grid-template-columns:repeat(2,minmax(0,1fr))}
textarea.code{font-family:var(--f-mono);font-size:11px;height:110px;resize:vertical}
.loglist{max-height:360px;overflow:auto}

/* ---- 모달/토스트 ---- */
.scrim{position:fixed;inset:0;background:rgba(10,16,32,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--surface);border-radius:16px;padding:20px;width:min(480px,100%);max-height:calc(100vh - 32px);overflow:auto;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line)}
.modal.wide{width:min(720px,100%)}
.modal h3{margin:0;font-size:17px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.modal h4{margin:0;font-size:12px;color:var(--muted)}
.modal .sub{margin:-6px 0 0;font-size:13px;color:var(--muted)}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.modal .acts.left{justify-content:flex-start}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.chk input{margin-top:3px;accent-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 10px 9px 14px;border-radius:12px;font-size:13px;font-weight:600;z-index:60;display:flex;gap:10px;align-items:center;max-width:calc(100% - 32px);animation:pop .25s ease-out}
.toast .pw{color:var(--fur);display:flex}
.toast button{border:0;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:4px 10px;font-weight:700;font-size:12px;white-space:nowrap}
@keyframes pop{from{transform:translate(-50%,10px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@keyframes stampin{0%{transform:scale(1.7) rotate(-25deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.justdone .tog,.justdone .stamp{animation:stampin .38s ease-out}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- 반응형 ---- */
@media (max-width:1180px){.sheetlay{grid-template-columns:minmax(0,1fr)}
  .panel{position:fixed;top:auto;left:0;right:0;bottom:0;max-height:72vh;z-index:30;border-radius:18px 18px 0 0;box-shadow:0 -10px 30px rgba(10,16,32,.2);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
  .panel.idle{display:none}
  .sumbar{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:1100px){.schedsplit{grid-template-columns:minmax(0,1fr)}}
@media (max-width:1060px){.homegrid,.callay,.ttlay,.datalay{grid-template-columns:minmax(0,1fr)}.week5{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}}
@media (max-width:760px){
  .steps{grid-template-columns:minmax(0,1fr)}
  .sheet .tp{position:static}.sheet-wrap{max-height:none}
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:40;border-right:0;border-top:1px solid var(--line)}
  .brand,.hello,#subjbox{display:none}
  .railbot{margin:0;flex:none;flex-direction:row}.railbot .helpbtn[data-a=install],.railbot .helpbtn[data-a=recapps]{display:none}.helpbtn{flex-direction:column;gap:2px;font-size:10px;padding:6px 8px;border:0;background:none}
  .nav{flex-direction:row;justify-content:space-around;width:100%}
  .nav button{flex-direction:column;gap:2px;font-size:10px;padding:6px 2px}
  .nav .badge{position:absolute;top:2px;right:2px;margin:0}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:100px}
  .sumbar{grid-template-columns:repeat(2,minmax(0,1fr))}
  .focus{grid-template-columns:minmax(0,1fr)}
  .focus .when{flex-direction:row;align-items:center;gap:12px;padding:12px 16px}
  .focus .when .st{margin:0 0 0 auto}
  .focus .when .p{font-size:30px}
  .row{grid-template-columns:54px 6px minmax(0,1fr)}
  .row .acts{grid-column:1/-1}
  .panel{bottom:calc(62px + env(safe-area-inset-bottom,0px))}
  .cmp{grid-template-columns:minmax(0,1fr)}
  .day{min-height:56px;padding:3px}.day .ev{display:none}
  .pip{font-size:0;width:8px;height:8px;padding:0;border-radius:50%}
  .weekg{grid-template-columns:minmax(0,1fr)}.wcol{min-height:0}
  .filters{margin-left:0}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .crow{grid-template-columns:44px 32px minmax(0,1fr)}.crow .dt2{display:none}
  .mobhide{display:none}
}

/* ---- 진행 중 · 교과 시트 · 홈 배너 ---- */
.dg{font-size:14px;color:var(--doing);font-weight:800;line-height:1.15}
.dg small{display:block;font-size:11.5px;font-weight:600;color:var(--muted)}
.seg3 button .pw{display:inline-flex}.seg3 .pw.off{color:var(--paw-off)}.seg3 .pw.dg{color:var(--doing)}.seg3 .pw.ok{color:var(--ok)}
.seg3 button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg);box-shadow:inset 0 -3px 0 var(--accent)}
.calbar .btn:disabled{opacity:.35;cursor:not-allowed}
.topc{gap:12px}.topc h1{margin-right:0}.tb.ico{padding:4px 10px;font-size:15px;line-height:1}.topc .meta{margin-left:auto;gap:8px}
.semwrap{align-self:center;margin:0 6px 2px 0}
.semdd{position:relative;display:inline-block}
.semdd summary{list-style:none;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:99px;padding:5px 13px;font-size:13px;font-weight:700;white-space:nowrap;user-select:none}
.semdd summary::-webkit-details-marker{display:none}
.semdd .semmenu{position:absolute;z-index:30;top:calc(100% + 6px);left:0;min-width:140px;background:var(--surface);border:1px solid var(--line-2);border-radius:12px;box-shadow:0 8px 24px rgba(20,40,100,.18);padding:5px;display:flex;flex-direction:column;gap:2px}
.semdd .semmenu button{border:0;background:none;text-align:left;padding:7px 10px;border-radius:8px;font-size:13px;font-weight:600;white-space:nowrap}
.semdd .semmenu button:hover{background:var(--accent-soft)}.semdd .semmenu button[aria-pressed=true]{color:var(--accent);background:var(--accent-soft)}
.stabs{display:flex;gap:4px;align-items:flex-end;flex-wrap:wrap;margin:0 0 12px;border-bottom:2px solid var(--line-2)}
.stab{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-bottom:0;border-radius:10px 10px 0 0;background:var(--surface-2);margin-bottom:-2px}
.stab > button{border:0;background:none;padding:7px 14px;font-size:13.5px;font-weight:700;color:var(--muted);border-radius:10px 10px 0 0}
.stab > button[role=tab]{display:flex;flex-direction:column;align-items:flex-start;gap:0;line-height:1.25;padding:5px 12px}
.stab > button[role=tab] small{font-size:10.5px;font-weight:500;opacity:.75}
.achip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.achip.all{padding:5px 14px;font-weight:700}
.pwrap{position:relative;display:inline-flex}
.pedit{position:absolute;top:-8px;right:-8px;width:20px;height:20px;border-radius:50%;border:1px solid var(--line-2);background:var(--surface);color:var(--accent);display:inline-flex;align-items:center;justify-content:center;padding:0;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .12s;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.pwrap:hover .pedit,.pwrap:focus-within .pedit{opacity:1;pointer-events:auto}
.pedit:hover{background:var(--accent-soft);color:var(--accent)}
@media(hover:none){.pedit{opacity:1;pointer-events:auto}}
.panel textarea,.panel .inp{resize:none}
.swatches.col2{flex-direction:column;align-items:flex-start;gap:8px}.swatches.col2 .srow{display:flex;gap:6px;align-items:center;flex-wrap:nowrap}
.rtbox{border:1px solid var(--line-2);border-radius:9px;background:var(--surface);overflow:hidden}.rtbox:focus-within{border-color:var(--accent)}
.rtbar{display:flex;gap:2px;padding:3px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.rtbar button{width:28px;height:26px;border:0;background:none;border-radius:6px;font-size:14px;color:var(--fg)}.rtbar button:hover{background:var(--accent-soft);color:var(--accent)}
.rt{min-height:84px;max-height:240px;overflow:auto;padding:7px 10px;font-size:14px;line-height:1.55;outline:none;white-space:pre-wrap;word-break:break-word}
.rt:empty::before{content:attr(data-ph);color:var(--muted);opacity:.7}

#tourShield{position:fixed;inset:0;z-index:70;background:transparent}
#tourCard{position:fixed;z-index:71;left:50%;bottom:20px;transform:translateX(-50%);width:min(560px,calc(100vw - 24px));background:var(--surface);border:1px solid var(--accent);border-radius:16px;box-shadow:0 12px 40px rgba(20,40,100,.3);padding:14px 16px 12px;display:flex;flex-direction:column;gap:8px}
#tourCard .tchd{display:flex;align-items:center;gap:8px;font-size:15px}
#tourCard .tcbody{font-size:13.5px;line-height:1.6}#tourCard .tcbody p{margin:0 0 6px}
#tourCard .tcft{display:flex;gap:8px;align-items:center}
body.touring main{padding-bottom:300px}
.tour-hl{outline:3px solid var(--accent)!important;outline-offset:3px;box-shadow:0 0 0 7px color-mix(in srgb,var(--accent) 22%,transparent)!important;border-radius:12px;animation:tourPulse 1.5s ease-in-out infinite}
@keyframes tourPulse{50%{box-shadow:0 0 0 11px color-mix(in srgb,var(--accent) 12%,transparent)}}
@media (max-width:760px){#tourCard{bottom:72px}}
.pinfo{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.stab.on{background:var(--surface);border-color:var(--line-2);border-bottom:2px solid var(--surface)}
.stab.on > button{color:var(--accent)}
.stab .sm{padding:7px 8px 7px 0;font-size:15px;color:var(--muted)}
.stab.add{background:none;border-style:dashed}

const clone=o=>JSON.parse(JSON.stringify(o));
let _id=0;const uid=p=>p+Date.now().toString(36)+(_id++).toString(36);
const stamp=()=>{const n=new Date();return `${n.getMonth()+1}/${n.getDate()} ${pad(n.getHours())}:${pad(n.getMinutes())}`};

/* ---- 빈 데이터 ---- */
function emptyDB(sem=2,terms=DEFAULT_TERMS){const ts=JSON.parse(JSON.stringify(terms));
  return {v:4,terms:ts,term:{...ts[sem]},periods:{...DEFAULT_PTIME},
  trackFrom:null,classes:[],lessons:[],records:{},tt:[{from:ts[sem].start,slots:[]}],exc:[],inbox:[],events:[],assess:[],todos:[]}}
/* 학기 기간을 dy년만큼 옮김 (월·일은 그대로) */
const YT=()=>(STORE.yterms=STORE.yterms||{});
const getYT=y=>YT()[y]?JSON.parse(JSON.stringify(YT()[y])):shiftTerms(DEFAULT_TERMS,y-BASE_YEAR);
function seedYT(){STORE.subjects.forEach(sb=>{if(sb.year&&!YT()[sb.year]&&sb.db&&sb.db.terms&&sb.db.terms[1]&&sb.db.terms[2])YT()[sb.year]=JSON.parse(JSON.stringify(sb.db.terms))})}
function shiftTerms(terms,dy){const sh=s=>{if(!dy||!s)return s;const d=D(s);d.setFullYear(d.getFullYear()+dy);return key(d)};
  const o={};[1,2].forEach(k=>{o[k]={start:sh(terms[k].start),end:sh(terms[k].end)}});return o}
/* 교과 시트 정보: 연도·학기·학년·교과. 시트 이름(name)은 이 값들로 만든다 */
const subjMain=sb=>`${sb.grade?sb.grade+'학년 ':''}${sb.subj||''}`.trim()||sb.name||'교과';
const subjMeta=sb=>`${sb.year||''} · ${sb.sem||''}학기`;
const subjName=sb=>`${sb.year} ${sb.sem}학기 ${subjMain(sb)}`;
/* 예전에 저장된 시트에 새 항목을 채운다. 여러 번 불러도 결과가 같다 */
function ensureSub(sb,db=sb.db){
  if(!sb.subj){sb.subj=sb.name||'내 교과'}
  if(sb.grade==null)sb.grade='';
  const t=db.term||OLD_TERM;
  if(!sb.year)sb.year=+t.start.slice(0,4);
  if(sb.sem!==1&&sb.sem!==2){const m=+t.start.slice(5,7);sb.sem=m>=3&&m<=7?1:2}
  if(!db.terms||!db.terms[1]||!db.terms[2]){
    const base=shiftTerms(DEFAULT_TERMS,sb.year-BASE_YEAR);
    const mine=(t.start===OLD_TERM.start&&t.end===OLD_TERM.end)?base[sb.sem]:{start:t.start,end:t.end};
    db.terms={...base,[sb.sem]:mine};db.term={...mine}}
  const p=db.periods||{};if([1,2,3,4,5,6,7].every(k=>p[k]===OLD_PTIME[k]))db.periods={...DEFAULT_PTIME};
  sb.name=subjName(sb)}
function validDB(db){return db&&db.v===4&&db.term&&Array.isArray(db.classes)&&Array.isArray(db.lessons)&&db.records&&Array.isArray(db.tt)&&Array.isArray(db.exc)&&Array.isArray(db.assess)}

/* ---- 학급·차시 ---- */
const clsIds=db=>db.classes.map(c=>c.id);
const lessonIdx=(db,id)=>db.lessons.findIndex(l=>l.id===id)+1; // 차시 번호 (없으면 0)
const rec=(db,c,n)=>{const l=db.lessons[n-1];return l&&db.records[c]?db.records[c][l.id]:undefined};
function setRec(db,c,n,val){const l=db.lessons[n-1];if(!l)return;db.records[c]=db.records[c]||{};if(val)db.records[c][l.id]=val;else delete db.records[c][l.id]}
function nextN(db,c){let n=1;while(n<=db.lessons.length&&rec(db,c,n)?.done)n++;return n}
function recDates(db,c){const m={};db.lessons.forEach((l,i)=>{const r=db.records[c]?.[l.id];if(r&&r.done&&r.date)(m[r.date]=m[r.date]||[]).push(i+1)});return m}
const newLesson=()=>({id:uid('l'),topic:'',pages:'',content:'',note:'',materials:'',plan:''});

/* ---- 수업 없는 날 ---- */
const inRange=(k,e)=>k>=e.s&&k<=(e.e||e.s);
const targets=(db,a)=>a.classes==='all'||!a.classes?clsIds(db):a.classes;
function dayBlock(db,k){const dw=D(k).getDay();if(dw===0||dw===6)return '주말';
  const h=HOLIDAYS.find(e=>inRange(k,e))||db.events.find(e=>e.block&&inRange(k,e));return h?h.label:null}
function classBlock(db,k,c){const g=dayBlock(db,k);if(g)return g;
  const a=db.assess.find(x=>x.type==='exam'&&x.noClass&&k>=x.start&&k<=(x.end||x.start)&&targets(db,x).includes(c));return a?a.title:null}
const MOCK_RE=/전국연합학력평가|모의고사|모의평가/;
function autoAbs(sb){const db=sb.db;if(!db||!db.events||!db.events.length)return false;let ch=false;
  for(const ev of db.events){const lab=String(ev.label||'');if(!MOCK_RE.test(lab))continue;
    const gs=new Set();let m=lab.match(/고\s*([1-3](?:\s*[,·ㆍ.\/]\s*[1-3])*)/);if(m)(m[1].match(/[1-3]/g)||[]).forEach(x=>gs.add(x));
    (lab.match(/([1-3])\s*학년/g)||[]).forEach(x=>gs.add(x[0]));
    if(gs.size&&sb.grade&&!gs.has(String(sb.grade)))continue;
    for(let k=ev.s;k<=(ev.e||ev.s);k=addK(k,1)){if(k<db.term.start||k>db.term.end)continue;const dw=D(k).getDay();if(dw===0||dw===6)continue;if(HOLIDAYS.find(h=>inRange(k,h)))continue;
      for(const t of ttFor(db,k).filter(x=>x.d===dw)){if(!clsIds(db).includes(t.c))continue;
        if(db.exc.some(e=>e.type==='absence'&&e.date===k&&e.c===t.c&&e.p===t.p))continue;
        if(db.exc.some(e=>e.type==='move'&&e.state==='active'&&e.date===k&&e.c===t.c&&e.p===t.p))continue;
        if(Object.values(recDates(db,t.c)[k]||[]).length)continue;
        db.exc.push({id:uid('a'),type:'absence',date:k,c:t.c,p:t.p,reason:lab.length>18?lab.slice(0,18):lab,note:'',src:'자동(학사일정)',state:'active',at:stamp()});ch=true}}}
  return ch}
function ttFor(db,k){let v=null;for(const t of db.tt)if(t.from<=k&&(!v||t.from>=v.from))v=t;return v?v.slots:[]}
const isPast=(db,k,p)=>k<TK||(k===TK&&toMin(db.periods[p])+50<=NOWMIN);
const isNow=(db,k,p)=>k===TK&&toMin(db.periods[p])<=NOWMIN&&NOWMIN<toMin(db.periods[p])+50;

/* 하루의 수업 칸. 결손·이동된 원래 칸도 지우지 않고 상태로 남긴다 */
function rawSessions(db,k,ex){
  const dw=D(k).getDay();const ids=clsIds(db);
  const out=ttFor(db,k).filter(s=>s.d===dw&&ids.includes(s.c)&&!classBlock(db,k,s.c)).map(s=>({date:k,c:s.c,p:s.p,st:'on'}));
  ex.forEach(e=>{if(e.type==='move'&&e.date===k){const t=out.find(x=>x.st==='on'&&!x.movedIn&&x.c===e.c&&x.p===e.p);if(t){t.st='movedOut';t.excId=e.id}}});
  ex.forEach(e=>{if(e.type==='move'&&e.toDate===k&&ids.includes(e.c)&&!classBlock(db,k,e.c)&&originOk(db,e))out.push({date:k,c:e.c,p:e.toP,st:'on',movedIn:e.id,from:{date:e.date,p:e.p}})});
  ex.forEach(e=>{if(e.type==='extra'&&e.date===k&&ids.includes(e.c)&&!classBlock(db,k,e.c))out.push({date:k,c:e.c,p:e.p,st:'on',extra:e.id})});
  ex.forEach(e=>{if(e.type==='absence'&&e.date===k){const t=out.find(x=>x.st==='on'&&x.c===e.c&&x.p===e.p);if(t){t.st='absent';t.excId=e.id}}});
  return out.sort((a,b)=>a.p-b.p||(a.st==='on'?-1:1));
}
function originOk(db,e){if(classBlock(db,e.date,e.c))return false;const dw=D(e.date).getDay();return ttFor(db,e.date).some(s=>s.d===dw&&s.c===e.c&&s.p===e.p)}
const activeExc=(db,opt={})=>db.exc.filter(e=>e.state==='active'&&!(opt.skip||[]).includes(e.id)).concat(opt.extra||[]);
/* 발자국을 눌렀을 때 기록할 날짜: 앞 차시보다 항상 뒤(오름차순)가 되도록, 아직 기록되지 않은 수업 칸 중 가장 이른 날 */
function suggestDateDb(db,c,n){const ex=activeExc(db),recs=db.records[c]||{};
  let lo=db.term.start;for(let i=1;i<n;i++){const r=rec(db,c,i);if(r&&r.done&&r.date>lo)lo=r.date}
  const used={};Object.values(recs).forEach(r=>{if(r.done&&r.date)used[r.date]=(used[r.date]||0)+1});
  const pick=(from,to)=>{for(let k=from;k<=to;k=addK(k,1)){const cnt=rawSessions(db,k,ex).filter(x=>x.c===c&&x.st==='on').length;if(cnt&&(used[k]||0)<cnt)return k}return null};
  const yest=addK(TK,-1),tf=db.trackFrom&&db.trackFrom>lo?db.trackFrom:lo;
  return (tf<=yest&&pick(tf,yest))||pick(lo,TK)||TK}

/* 모든 화면이 쓰는 단 하나의 일정 계산.
   완료 = 그날 실제 기록이 있는 칸 / 확인 필요 = 지난 칸인데 기록 없음 / 예정 = 앞으로의 칸, 다음 차시부터 순서대로 배정 */
function buildSched(db,opt={}){
  const ex=activeExc(db,opt);
  const S={by:{},cls:{},key:{},plan:{},conflicts:[],nextN:{},absent:{}};
  const rd={},used={},nx={},lastD={};
  clsIds(db).forEach(c=>{rd[c]=recDates(db,c);lastD[c]=Object.keys(rd[c]).sort().pop()||'';used[c]={};nx[c]=nextN(db,c);S.cls[c]=[];S.plan[c]={};S.nextN[c]=nx[c];S.absent[c]=0});
  const {start,end}=db.term;
  for(let k=start;k<=end;k=addK(k,1)){
    const ss=rawSessions(db,k,ex);
    S.by[k]=ss.filter(s=>!(s.st==='on'&&!(rd[s.c][k]||[]).length&&((db.trackFrom&&k<db.trackFrom)||k<lastD[s.c])));
    for(const s of S.by[k]){s.key=`${k}|${s.c}|${s.p}`;
      if(s.st==='absent'){s.status='absent';S.absent[s.c]++}
      else if(s.st==='movedOut')s.status='moved';
      else{const r=rd[s.c][k]||[],u=used[s.c][k]||0;
        if(u<r.length){s.status='done';s.n=r[u];used[s.c][k]=u+1}
        else if(isPast(db,k,s.p)){s.status='check';s.n=nx[s.c]++;if(!S.plan[s.c][s.n])S.plan[s.c][s.n]=s}
        else{s.status='plan';s.n=nx[s.c]++;if(!S.plan[s.c][s.n])S.plan[s.c][s.n]=s}}
      S.key[s.key]=s;S.cls[s.c].push(s)}
  }
  /* 그날 이 반 수업 칸이 하나도 없으면 충돌. 한 시간에 여러 차시를 기록한 경우는 정상 */
  clsIds(db).forEach(c=>{for(const [k,arr] of Object.entries(rd[c])){if(!(used[c][k]>0))arr.forEach(n=>S.conflicts.push({c,n,date:k}))}});
  return S;
}
/* 일정 (공휴일 + 학교 일정 + 평가) */
function allEvents(db){return HOLIDAYS.map(h=>({...h,kind:'hol',block:true,src:'기본 공휴일'}))
  .concat(db.events.map(e=>({...e,kind:e.kind||'event'})))
  .concat(db.assess.map(a=>({s:a.start,e:a.end||a.start,label:a.title,kind:a.type,assessId:a.id,block:a.type==='exam'&&a.noClass})))}
const eventsOn=(db,k)=>allEvents(db).filter(e=>inRange(k,e));
function nextExam(db,c){return db.assess.filter(a=>a.type==='exam'&&a.start>TK&&(!c||targets(db,a).includes(c))).sort((a,b)=>a.start<b.start?-1:1)[0]}
const lastBefore=(S,c,k)=>{let n=(S.nextN[c]||1)-1;for(const s of S.cls[c]||[])if((s.status==='plan'||s.status==='check')&&s.date<k)n=Math.max(n,s.n);return n};
/* 시험 범위 도달 예측: 시험 시작 전까지 예정 수업으로 범위 끝 차시를 마칠 수 있는지 */
function examReach(db,S,a,c){const to=a.toId?lessonIdx(db,a.toId):0;if(!to)return null;
  const last=lastBefore(S,c,a.start);return {to,last,short:Math.max(0,to-last)}}

/* ---- 변경 동작 (db를 직접 바꾼다. 화면 쪽에서 실행 취소용 스냅숏을 남긴다) ---- */
const C={
  complete(db,c,n,date){const r=rec(db,c,n)||{};setRec(db,c,n,{done:true,date,memo:r.memo||'',actual:r.actual||''})},
  uncomplete(db,c,n){const r=rec(db,c,n);if(!r)return;if(r.memo||r.actual)setRec(db,c,n,{...r,done:false,date:''});else setRec(db,c,n,null)},
  setRecord(db,c,n,val){setRec(db,c,n,val)},
  absence(db,list,reason,note,opt={}){
    list.forEach(s=>{if(opt.revertDone&&s.status==='done')C.uncomplete(db,s.c,s.n);
      db.exc.push({id:uid('a'),type:'absence',date:s.date,c:s.c,p:s.p,reason,note:note||'',src:opt.src||'직접',state:'active',at:stamp()})})},
  move(db,s,toDate,toP,note,opt={}){let od=s.date,op=s.p;
    if(s.movedIn){const prev=db.exc.find(e=>e.id===s.movedIn);od=prev.date;op=prev.p;prev.state='cancelled'}
    if(opt.revertDone&&s.status==='done')C.uncomplete(db,s.c,s.n);
    if(od===toDate&&op===toP)return;
    db.exc.push({id:uid('m'),type:'move',date:od,c:s.c,p:op,toDate,toP,reason:opt.reason||'수업 교환',note:note||'',src:opt.src||'직접',state:'active',at:stamp()})},
  extra(db,c,date,p,note){db.exc.push({id:uid('x'),type:'extra',date,c,p,reason:'수업 보강',note:note||'',src:'직접',state:'active',at:stamp()})},
  setExc(db,id,state){const e=db.exc.find(x=>x.id===id);if(e)e.state=state},
  accept(db,id,opt={}){const i=db.inbox.find(x=>x.id===id);const S=buildSched(db);
    const s=S.key[`${i.date}|${i.c}|${i.p}`];
    if(!s||!['plan','check','done'].includes(s.status))return false;
    if(i.type==='move'&&validateMove(db,S,s,i.toDate,i.toP))return false;
    const before=db.exc.length;
    if(i.type==='absence')C.absence(db,[s],'학교 행사',i.why,{src:'시간표 변경',revertDone:opt.revertDone});
    else C.move(db,s,i.toDate,i.toP,i.why,{src:'시간표 변경',reason:'시간표 변경',revertDone:opt.revertDone});
    i.state='accepted';i.excId=db.exc.length>before?db.exc[db.exc.length-1].id:null;return true},
  dismiss(db,id){db.inbox.find(x=>x.id===id).state='dismissed'},
  setTT(db,from,slots){db.tt=db.tt.filter(t=>t.from<from);db.tt.push({from,slots:clone(slots)});db.tt.sort((a,b)=>a.from<b.from?-1:1)},
  /* 학급 */
  addClass(db,name,lead){const used=db.classes.map(c=>c.color);let color=1;for(let i=1;i<=PALETTE;i++){if(!used.includes(i)){color=i;break}color=(db.classes.length%PALETTE)+1}
    const c={id:uid('c'),name,lead:lead||'',color};db.classes.push(c);db.records[c.id]={};return c},
  setClass(db,id,f,v){const c=db.classes.find(x=>x.id===id);if(c)c[f]=v},
  moveClass(db,id,dir){const i=db.classes.findIndex(c=>c.id===id),j=i+dir;if(i<0||j<0||j>=db.classes.length)return false;const t=db.classes[i];db.classes[i]=db.classes[j];db.classes[j]=t},
  removeClass(db,id){db.classes=db.classes.filter(c=>c.id!==id);delete db.records[id];
    db.tt.forEach(t=>t.slots=t.slots.filter(s=>s.c!==id));db.exc=db.exc.filter(e=>e.c!==id);db.inbox=db.inbox.filter(e=>e.c!==id);
    db.assess.forEach(a=>{if(Array.isArray(a.classes))a.classes=a.classes.filter(x=>x!==id)})},
  /* 차시 */
  addLessons(db,count,at){const ls=Array.from({length:count},newLesson);const i=at==null?db.lessons.length:Math.max(0,Math.min(at,db.lessons.length));db.lessons.splice(i,0,...ls);return ls},
  setLesson(db,n,f,v){const l=db.lessons[n-1];if(l)l[f]=v},
  moveLesson(db,n,dir){const i=n-1,j=i+dir;if(j<0||j>=db.lessons.length)return false;const t=db.lessons[i];db.lessons[i]=db.lessons[j];db.lessons[j]=t},
  removeLesson(db,n){const l=db.lessons[n-1];if(!l)return;db.lessons.splice(n-1,1);Object.values(db.records).forEach(r=>delete r[l.id]);
    db.assess.forEach(a=>{if(a.fromId===l.id)a.fromId=null;if(a.toId===l.id)a.toId=null;if(a.lessonId===l.id)a.lessonId=null})},
  /* 표 붙여넣기: n차시의 field 열부터 rows(2차원) 채우기, 모자라면 차시 추가 */
  pasteGrid(db,n,field,rows){const f0=LESSON_FIELDS.indexOf(field);let added=0;
    rows.forEach((cols,ri)=>{const idx=n-1+ri;if(idx>=db.lessons.length){C.addLessons(db,1);added++}
      cols.forEach((v,ci)=>{const f=LESSON_FIELDS[f0+ci];if(f)db.lessons[idx][f]=v.trim()})});return added},
  /* 평가 */
  saveAssess(db,a){const i=db.assess.findIndex(x=>x.id===a.id);if(i>=0)db.assess[i]=a;else db.assess.push({...a,id:a.id||uid('v')})},
  removeAssess(db,id){db.assess=db.assess.filter(a=>a.id!==id)},
  /* 학교 일정 */
  addEvent(db,e){db.events.push({...e,id:uid('e')})},
  removeEvent(db,id){db.events=db.events.filter(e=>e.id!==id)},
  importNeisEvents(db,evs,exams){db.events=db.events.filter(e=>e.src!=='NEIS');evs.forEach(e=>db.events.push({...e,id:uid('n'),src:'NEIS'}));
    db.assess=db.assess.filter(a=>a.src!=='NEIS');exams.forEach(a=>db.assess.push({...a,id:uid('v'),src:'NEIS'}))},
};
function validateMove(db,S,s,toDate,toP){
  if(!toDate)return '옮길 날짜를 고르세요.';
  if(toDate<db.term.start||toDate>db.term.end)return '학기 기간 밖의 날짜예요.';
  const b=classBlock(db,toDate,s.c);if(b)return `${md(toDate)}은 ${b}라서 수업을 넣을 수 없어요.`;
  const occ=(S.by[toDate]||[]).find(x=>x.p===toP&&['plan','check','done'].includes(x.status)&&x.key!==s.key);
  if(occ)return `${md(toDate)} ${toP}교시에는 이미 ${clsName(db,occ.c)} 수업이 있어요.`;
  if(toDate===s.date&&toP===s.p)return '지금과 같은 날짜·교시예요.';
  return '';
}
/* 정기시험 기간은 평일만: 시작이 주말이면 다음 월요일로, 끝이 주말이면 앞 금요일로 */
function weekdays(s,e){e=e||s;let a=s,b=e;while(a<=b&&[0,6].includes(D(a).getDay()))a=addK(a,1);while(b>=a&&[0,6].includes(D(b).getDay()))b=addK(b,-1);return a<=b?{start:a,end:b}:null}
const clsName=(db,id)=>(db.classes.find(c=>c.id===id)||{name:'?'}).name||'(이름 없음)';
function shiftNote(before,after,c,n){
  const a=after.plan[c][n],b=before.plan[c][n];
  if(!a)return `${n}차시를 넣을 수업이 학기 안에 남지 않아요`;
  if(b&&a.key===b.key)return `${n}차시 일정은 그대로예요`;
  return `${n}차시가 ${mdw(a.date)} ${a.p}교시로 ${b&&a.date<b.date?'당겨져요':'밀려요'}`;
}
/* NEIS 응답 해석 */
function parseMeal(row){const items=String(row.DDISH_NM||'').split(/<br\s*\/?>|\n/i).map(x=>x.trim()).filter(Boolean).map(x=>{const m=x.match(/\(([\d.\s]+)\)\s*$/);return {name:x.replace(/\(([\d.\s]+)\)\s*$/,'').replace(/[*★]+$/,'').trim(),alg:m?m[1].replace(/\s/g,'').replace(/\.$/,''):''}});
  const y=String(row.MLSV_YMD);return {date:`${y.slice(0,4)}-${y.slice(4,6)}-${y.slice(6,8)}`,type:row.MMEAL_SC_NM||'',items,cal:row.CAL_INFO||''}}
function parseSchedule(rows){const ymd=y=>`${y.slice(0,4)}-${y.slice(4,6)}-${y.slice(6,8)}`;
  const evs=[],examDays={};
  rows.forEach(r=>{const k=ymd(String(r.AA_YMD)),nm=String(r.EVENT_NM||'').trim();if(!nm||nm==='토요휴업일')return;
    const sub=String(r.SBTR_DD_SC_NM||'');const isHol=sub==='휴업일'||sub==='공휴일'||/휴업|방학|공휴일/.test(nm)&&!/개학|식$/.test(nm);
    if(/지필|고사|정기\s*시험|중간\s*평가|기말/.test(nm)&&!/모의|대비/.test(nm)){(examDays[nm]=examDays[nm]||[]).push(k);return}
    evs.push({s:k,e:k,label:nm,kind:isHol?'hol':'event',block:isHol})});
  const exams=Object.entries(examDays).map(([nm,ds])=>{ds.sort();return {type:'exam',title:nm,start:ds[0],end:ds[ds.length-1],classes:'all',noClass:true,fromId:null,toId:null,note:''}});
  return {evs,exams}}

const HST={check:['기록 필요','warn'],done:['수업 완료','ok'],plan:['예정','info'],now:['수업 중','info'],absent:['결손','bad'],moved:['교환됨','gray']};
/* 교과 시트 하나의 오늘 현황. withSub 안에서 불러야 해요 */
function homeSub(sb){
  const tday=SCH.by[TK]||[];
  const act=tday.filter(s=>['plan','check','done'].includes(s.status));
  const done=act.filter(s=>s.status==='done'),plan=act.filter(s=>s.status==='plan');
  const checks=[];for(let i=21;i>=0;i--){(SCH.by[addK(TK,-i)]||[]).forEach(s=>{if(s.status==='check')checks.push(s)})}
  const pend=DB.inbox.filter(i=>i.state==='pending'),conf=SCH.conflicts;
  const sq=`var(--c${Math.max(0,STORE.subjects.findIndex(x=>x.id===sb.id))%PALETTE+1})`;
  /* 오늘의 수업 목록 */
  const rows=tday.map(s=>{const k=s.status==='plan'&&isNow(DB,TK,s.p)?'now':s.status,[lab,tg]=HST[k],n=s.n||SCH.nextN[s.c],dead=s.status==='absent'||s.status==='moved';
    const sub2=s.status==='absent'?`${esc(excOf(s)?.reason||'')} ${esc(excOf(s)?.note||'')}`:s.status==='moved'?moveDest(s):esc(lname(n));
    const pawb=dead?'':s.status==='done'?`<button class="tog on" data-a="uncomplete" data-x="${s.c}|${s.n}" title="완료 취소" aria-label="${esc(cn(s.c))} ${s.p}교시 완료 취소">${paw(20)}</button>`
      :`<button class="tog" data-a="done" data-x="${s.key}" title="수업 완료로 기록" aria-label="${esc(cn(s.c))} ${s.p}교시 수업 완료로 기록">${paw(20)}</button>`;
    return {p:s.p,html:`<div class="lrow ${k}" style="--cc:${sq}" data-sub="${sb.id}" data-a="sess" data-x="${s.key}" role="button" tabindex="0">
      <div class="tm"><b>${s.p}교시</b><span class="mono">${PT(s.p)}~${endT(s.p)}</span></div>
      <div class="bd"><span class="sq">${ic('book',13)}</span><div class="tx"><span class="l1"><b>${esc(cn(s.c))}</b><small>${esc(subjMain(sb))}${dead?'':` · ${n}차시`}</small>${s.movedIn?`<span class="tag gray">${sic('moved',11)} ${s.from.p}교시에서 교환</span>`:''}</span><span class="tp">${sub2}</span></div></div>
      <div class="rt"><span class="tag lg ${tg}">${lab}</span>${pawb}</div></div>`}});
  /* 오늘 이전에 기록이 빠진 수업과 일정 충돌 (오늘 것은 위 목록에 보여요) */
  const olds=checks.filter(s=>s.date<TK);
  const arows=[...conf.map(x=>`<div class="row check" style="--cc:${ccv(x.c)}"><span class="pp mono">${md(x.date)}</span><span class="bar"></span><span class="ls"><b>${esc(cn(x.c))} ${x.n}차시 완료 기록</b><small>이날 ${esc(cn(x.c))} 수업 칸이 없어요(결손·교환). 기록 날짜를 확인하세요.</small></span><span class="acts"><button class="btn sm" data-a="day" data-x="${x.date}">일정 보기</button><button class="btn sm pri" data-a="cell" data-x="${x.c}|${x.n}">기록 확인</button></span></div>`),...olds.map(s=>rowHtml(s,'check'))];
  const alerts=arows.length?`<div class="dlist" data-sub="${sb.id}">${arows.slice(0,4).join('')}${arows.length>4?`<details class="more"><summary>나머지 ${arows.length-4}건 보기</summary>${arows.slice(4).join('')}</details>`:''}</div>`:'';
  const nAlert=Math.min(arows.length,4)+(arows.length>4?1:0);
  const auto=plan.map(s=>{const l=L(s.n);return l&&(l.note||l.materials)?{t:`${cn(s.c)}: ${[l.materials,l.note].filter(Boolean).join(' / ')}`}:null}).filter(Boolean);
  /* 교과 진도 현황: 가장 앞선 반 기준 */
  const total=DB.lessons.length,lead=DB.classes.length?Math.max(...DB.classes.map(c=>SCH.nextN[c.id]-1)):0;
  const prog=DB.classes.length&&total?{sbId:sb.id,name:subjMain(sb),meta:subjMeta(sb),sq,done:lead,total,pct:Math.round(lead/total*100),nCheck:checks.length,
    cls:DB.classes.map(c=>{const d=SCH.nextN[c.id]-1;return {name:cn(c.id),d,gap:lead-d,color:ccv(c.id)}})}:null;
  /* 다음 수업 */
  let nx=null;for(let i=0;i<60&&!nx;i++){const k=addK(TK,i),f=(SCH.by[k]||[]).find(x=>x.status==='plan');if(f){const les=L(f.n)||{};
    nx={date:k,p:f.p,key:f.key,sbId:sb.id,cn:cn(f.c),subj:subjMain(sb),n:f.n,topic:lname(f.n),pages:les.pages||'',materials:les.materials||'',note:les.note||'',t1:PT(f.p),t2:endT(f.p),now:isNow(DB,k,f.p)}}}
  /* 다가오는 일정 */
  const evs=allEvents(DB).filter(e=>(e.e||e.s)>=TK).map(e=>{const a=e.assessId?DB.assess.find(x=>x.id===e.assessId):null;
    const tg=a?(a.classes==='all'?'전체 학급':a.classes.map(cn).join(', ')):'';
    return {s:e.s,label:e.label,kind:e.kind,meta:a?`${subjMain(sb)} · ${tg}`:(e.kind==='hol'?'공휴일':'학교 일정'),key:(a?sb.id:'')+'|'+e.s+'|'+e.label}});
  return {hasCls:DB.classes.length>0,rows,nAct:act.length,nDone:done.length,nCheck:checks.length,nPend:pend.length,alerts,nAlert,auto,prog,nx,evs,plan};
}

  if(t<17*60+30)return P(['헥헥! 퇴근이 얼마 안 남았어요~ 기뻐서 꼬리가 막 돌아가요, 멍!','헥-헥! 조금만 더 하면 퇴근이에요! 신나요, 왈왈!','퇴근 시간이 코앞이에요! 폴짝폴짝 뛰고 싶어요, 멍멍!']);
  return P(['오늘도 정말 고생 많았어요, 멍! 푹 쉬어요~ 쓰담쓰담','하루 끝! 집에 가서 꼬리 흔들며 쉬어요, 헥헥~','낑… 아직 안 갔어요? 같이 얼른 퇴근해요, 왈!']);}

   (시험 범위는 직접 입력하지 않아요. 자동 색은 이 계산을, 차시별로 정한 색은 그 색을 따라가요) */
function periodList(){const exs=DB.assess.filter(a=>a.type==='exam').slice().sort((a,b)=>a.start<b.start?-1:a.start>b.start?1:0);
  const N=DB.lessons.length;let prev=0;
  return exs.map(a=>{let to=0;const ids=targets(DB,a);
    ids.forEach(c=>{for(const x of (SCH.cls[c]||[])){if(x.n&&x.date<a.start&&x.n>to)to=x.n}})
    to=Math.min(to,N);const from=prev+1;
    if(to>prev)prev=to;
    return {a,from,to,empty:to<from}}).map((x,i)=>({...x,k:i%6+1,col:`var(--p${i%6+1})`}))}
function periodSel(){if(U.periodSub!==STORE.cur){U.periodSub=STORE.cur;U.period=DB.uiPeriod||'all'}const pl=periodList();const cur=U.period==='all'?null:pl.find(p=>p.a.id===U.period);if(U.period!=='all'&&!cur)U.period='all';return {pl,cur}}

  const tabs=['2학기 수업'];

  const lead=DB.classes.length?Math.max(...DB.classes.map(c=>SCH.nextN[c.id]-1)):0;
  const {pl,cur}=periodSel();
  const tasks=DB.assess.filter(a=>a.type==='task').sort((a,b)=>a.start<b.start?-1:1);
  const pchip=p=>{const a=p.a,d=dday(a.start),past=(a.end||a.start)<TK;const tg=a.classes==='all'?'':a.classes.map(cn).join(', ');
    return `<span class="pwrap"><button class="achip exam ${past?'past':''}" style="--pc:${p.col}" data-a="period" data-x="${a.id}" aria-pressed="${!!cur&&cur.a.id===a.id}"><b>${past?'지남':d<=0?'진행 중':'D-'+d}</b><span>${esc(a.title)} <span class="muted">${md(a.start)}${a.end&&a.end!==a.start?'~'+md(a.end):''}${tg?' · '+esc(tg):''}</span></span></button><button class="pedit" data-a="avedit" data-x="${a.id}" aria-label="${esc(a.title)} 일정 편집" title="시험 일정 편집">${ic('pen',11)}</button></span>`};
  const pcol={};pl.forEach(q=>{if(!q.empty)for(let k=q.from;k<=q.to;k++)if(!pcol[k])pcol[k]={c:q.col,t:q.a.title,k:q.k}});
  const colOf=(les,n)=>les.col===0?null:les.col>0?{c:`var(--p${les.col})`,t:'',k:les.col}:(pcol[n]||null);
  /* 시기 칩을 누르면 그 칩 색으로 칠해진 차시만 보여준다 (차시별로 정한 색 > 자동 색) */
  const inP=n=>!cur||colOf(DB.lessons[n-1],n)?.k===cur.k;
  if(cur)cur.empty=!DB.lessons.some((l,i)=>colOf(l,i+1)?.k===cur.k);
  const strip=`<div class="astrip"><span class="muted" style="font-size:12px;font-weight:700">시기</span><button class="achip all" data-a="period" data-x="all" aria-pressed="${!cur}"><span>전체</span></button>${pl.map(pchip).join('')}<button class="btn sm" data-a="avnew">${DB.assess.length?'+ 평가 추가':'+ 정기시험 · 수행평가 추가'}</button>
    ${tasks.length?`<span class="muted" style="font-size:12px;font-weight:700;margin-left:6px">수행평가</span>${tasks.map(achip).join('')}`:''}
    ${DB.classes.length?`<span style="margin-left:auto">${DB.trackFrom?`<button class="btn sm" data-a="trk" data-x="term" title="${md(DB.trackFrom)} 이후만 계산 중이에요. 눌러서 학기 첫 수업일부터 다시 계산">${md(DB.trackFrom)} 기준 · 학기 첫 수업일로</button>`:`<button class="btn sm" data-a="trk" data-x="now" title="지난 수업을 건너뛰고 오늘부터 차시 예정일을 계산해요">현재일 기준으로 설정</button>`}</span>`:''}</div>
    ${cur&&cur.empty?'<div class="pinfo"><span class="warnbox">이 색의 차시가 아직 없어요. 차시 ⋯ 수업 정보에서 색을 정하거나 시간표를 확인해 보세요.</span></div>':''}`;
  let body;
  if(U.sheetMode==='all'||!DB.classes.length){
    const rows=DB.lessons.map((les,i)=>{const n=i+1;if(!inP(n))return '';const ex=colOf(les,n);const tasks=DB.assess.filter(a=>a.type==='task'&&a.lessonId===les.id);
      return `<tr class="${U.selRows.has(les.id)?'rsel':''}"><td class="sel0"><input type="checkbox" class="rchk" data-lid="${les.id}" ${U.selRows.has(les.id)?'checked':''} aria-label="${n}차시 선택"></td><td class="n ${ex?'inexam':''}" ${ex?`style="--pc:${ex.c}" title="${esc(ex.t)}"`:''}><div class="nw"><span class="num mono">${n}</span><button class="rm ${(!U.selCell&&U.selRow===n)||U.selCell?.n===n?'on':''}" data-a="lrow" data-x="${n}" aria-label="${n}차시 수업 정보 열기" title="수업 정보 (비고·교과서 쪽·준비물)">⋯</button></div>${tasks.map(t=>`<span class="rbadge task" title="${esc(t.title)}">${esc(t.title)}</span>`).join('')}</td>
        <td class="tp"><textarea class="ie" rows="1" data-lf="topic" data-n="${n}" placeholder="수업 주제" aria-label="${n}차시 수업 주제">${esc(les.topic)}</textarea>${clineHtml(n)}</td>
        ${DB.classes.map(c=>cellHtml(c,n)).join('')}<td class="cell" style="cursor:default;background:var(--surface)!important"></td></tr>`}).join('');
    const vis=DB.lessons.filter((l,i)=>inP(i+1));const allSel=vis.length>0&&vis.every(l=>U.selRows.has(l.id));
    const empty=cur&&DB.lessons.length&&!rows?`<tr class="emptyrow"><td colspan="${4+DB.classes.length}">이 시기에 해당하는 차시가 없어요. 위 안내를 확인해 주세요.</td></tr>`:!DB.lessons.length?`<tr class="emptyrow"><td colspan="${4+DB.classes.length}"><b style="color:var(--fg)">아직 차시가 없어요.</b><br>아래 버튼으로 차시를 만들고 칸에 바로 적거나, 엑셀에서 '주제·교과서·내용·비고' 열을 복사해 첫 주제 칸에 붙여넣으세요. (교과서·비고는 차시 번호 옆 ⋯를 누르면 열리는 수업 정보에 들어가요.)${DB.tt.some(t=>t.slots.length)?'':`<br><button class="btn pri" style="margin-top:10px" data-a="gottedit">먼저 기본 시간표 설정하러 가기</button>`}</td></tr>`:'';
    body=`<div class="sheet-wrap"><table class="sheet ${U.selRows.size?'hasSel':''}" style="--tpw:${U.tpW}px"><thead><tr><th class="sel0"><input type="checkbox" class="rchk" data-lid="all" ${allSel?'checked':''} aria-label="전체 선택·해제" title="전체 선택 / 해제"></th><th class="n">차시</th><th class="tp">수업 주제 · 내용<span class="rz" data-rz title="끌어서 열 너비 조절 (더블클릭: 기본값)"></span></th>${DB.classes.map(c=>clsHead(c,lead)).join('')}<th class="addc"><button class="btn sm pri" data-a="addclass">+ 학급</button></th></tr></thead>
      <tbody>${rows}${empty}<tr class="addrow"><td colspan="${4+DB.classes.length}"><div class="inner"><button class="btn sm" data-a="addrows" data-x="1">+ 차시 1개</button><button class="btn sm" data-a="addrows" data-x="5">+ 5개</button><button class="btn sm" data-a="addrows" data-x="10">+ 10개</button>${!DB.lessons.length?'<button class="btn sm" data-a="pasteask">엑셀에서 붙여넣기</button>':''}<span class="muted" style="font-size:12px">${cur&&!cur.empty?`${DB.lessons.filter((l,i)=>inP(i+1)).length}개 차시 표시 중 · `:''}총 ${DB.lessons.length}차시</span></div></td></tr></tbody></table></div>`;
  }else{if(!DB.classes.some(c=>c.id===U.sheetClass))U.sheetClass=DB.classes[0].id;const c=cobj(U.sheetClass);
    body=`<div class="classtabs">${DB.classes.map(x=>`<button data-a="cls" data-x="${x.id}" aria-pressed="${x.id===U.sheetClass}"><span class="dot" style="background:${ccv(x.id)}"></span>${esc(cn(x.id))}<span class="mono muted" style="font-weight:500">${SCH.nextN[x.id]-1}</span></button>`).join('')}</div>
    <div class="clist">${DB.lessons.map((les,i)=>{const n=i+1;if(!inP(n))return '';const v=rec(DB,c.id,n),nxt=SCH.nextN[c.id]===n,pl=SCH.plan[c.id]?.[n],sel=U.selCell?.c===c.id&&U.selCell.n===n;
      return `<div class="crow ${nxt?'next':''} ${sel?'sel':''} ${U.flash===c.id+'|'+n?'justdone':''} ${colOf(les,n)?'inper':''}" ${colOf(les,n)?`style="--pc:${colOf(les,n).c}"`:''} data-a="sel" data-x="${c.id}|${n}"><b class="mono">${n}차시</b><button class="tog ${v?.done?'on':v?.doing?'doing':''}" data-a="tog" data-x="${c.id}|${n}" aria-label="${n}차시 ${v?.done?'완료 취소':'완료로 표시'}">${paw(20)}</button><span style="min-width:0"><span>${esc(les.topic||'(주제 미입력)')}</span>${v?.memo?`<small style="color:var(--warn)">${esc(v.memo)}</small>`:les.note?`<small>${esc(les.note)}</small>`:''}</span><span class="dt2 mono" style="text-align:right;font-size:12px">${v?.done?mdw(v.date):pl?`<span class="${nxt?'nx':'pl'}">예정 ${mdw(pl.date)}</span>`:''}</span></div>`}).join('')||'<p class="muted">차시가 없어요. 전체 진도표에서 먼저 차시를 만드세요.</p>'}</div>`;
  }
  const PH=panelHtml();
  const legendH=`<span class="lgd"><button type="button" class="btn sm lgb" aria-label="범례 보기"><span class="lgi">?</span> 범례</button><div class="lgbox" role="tooltip"><span><span class="tog" style="width:22px;height:22px">${paw(16)}</span>아직 안 함 (누르면 완료)</span><span><span class="tog doing" style="width:22px;height:22px">${paw(16)}</span>진행 중 (오른쪽 '실제 수업 기록'에서 지정)</span><span><span class="tog on" style="width:22px;height:22px">${paw(16)}</span>수업함 (날짜·요일)</span><span><span class="nx mono">10/23</span>파란 글씨 = 다음 차시 예정일</span><span><span class="pl mono">10/27</span>시간표로 계산한 예정일</span><span><span style="flex:none;width:5px;height:18px;border-radius:3px;background:linear-gradient(var(--p1) 33%,var(--p2) 33% 66%,var(--p3) 66%)"></span>시기(시험)별 색 = 차시에 정한 색</span><span style="color:var(--bad)">${sic('check',11)} 일정 충돌</span></div></span>`;
  const tools=legendH;
  U.selRows.forEach(id=>{if(!DB.lessons.some(l=>l.id===id))U.selRows.delete(id)});
  const bulk=U.selRows.size&&U.sheetMode==='all'?`<div class="bulkbar"><b>${U.selRows.size}개 차시 선택됨</b><span class="muted">색</span><span class="swatches lcol"><button type="button" class="pill" data-a="bcol" data-x="a">자동</button><button type="button" class="pill" data-a="bcol" data-x="0">없음</button>${[1,2,3,4,5,6].map(k=>`<button type="button" data-a="bcol" data-x="${k}" style="--sw:var(--p${k})" aria-label="색 ${k}로 변경"></button>`).join('')}</span><span style="margin-left:auto;display:flex;gap:6px"><button class="btn sm bad" data-a="bdelask">삭제</button><button class="btn sm" data-a="bclear">선택 해제</button></span></div>`:'';
  const exm=nextExam(DB);
  return topbar('진도표',mode+tools,exm?`<button class="chip hot" data-a="avedit" data-x="${exm.id}" title="눌러서 일정 수정">${esc(exm.title)} D-${dday(exm.start)}</button>`:'')+subjTabs()+strip+bulk+`
  <div class="sheetlay ${PH?'withp':''}"><div style="min-width:0">${body}</div>${PH}</div>`;
}

/* ---------- 시간표 ---------- */
function miniWeek(S,mon,i,mode,base){
  const days=[0,1,2,3,4].map(x=>addK(mon,x));
  let rows='';for(let p=1;p<=7;p++){rows+=`<tr><th class="mono">${p}</th>${days.map(k=>{
    const g=dayBlock(DB,k);if(g)return p===1?`<td rowspan="7" class="hol">${esc(g)}</td>`:'';
    const s=(S.by[k]||[]).find(x=>x.p===p&&['plan','check','done'].includes(x.status));
    const inv=(k===i.date&&p===i.p)||(i.type==='move'&&k===i.toDate&&p===i.toP);
    if(mode==='after'&&!s&&k===i.date&&p===i.p&&(base.by[k]||[]).some(x=>x.p===p&&x.c===i.c))return `<td class="gone">${esc(cn(i.c))}</td>`;
    return s?`<td class="on ${inv&&s.c===i.c?'hl':''}" style="--cc:${ccv(s.c)}">${esc(cn(s.c))}</td>`:'<td></td>'}).join('')}</tr>`}
  return `<div class="tt-wrap"><table class="tt mtt"><thead><tr><th style="width:18px"></th>${days.map(k=>`<th>${wd(k)} <span class="mono">${md(k)}</span></th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`}
const inboxExc=i=>({id:'tmp-'+i.id,type:i.type,date:i.date,c:i.c,p:i.p,toDate:i.toDate,toP:i.toP,state:'active'});
function inboxCard(i){const after=buildSched(DB,{extra:[inboxExc(i)]});const orig=SCH.key[`${i.date}|${i.c}|${i.p}`];
  const mvErr=i.type==='move'&&orig?validateMove(DB,SCH,orig,i.toDate,i.toP):'';
  const usable=orig&&['plan','check','done'].includes(orig.status)&&!mvErr;const ex=nextExam(DB,i.c);const n=orig?.n||SCH.nextN[i.c];
  const aft=i.type==='absence'?`<div class="after cancel"><small>변경</small>결강</div>`:`<div class="after"><small>변경</small>${i.toDate!==i.date?mdw(i.toDate)+' ':''}${i.toP}교시 · ${PT(i.toP)}</div>`;
  const b=ex?lastBefore(SCH,i.c,ex.start):0,a=ex?lastBefore(after,i.c,ex.start):0;
  return `<div class="chg new"><div class="hd"><span class="dot" style="background:${ccv(i.c)}"></span><b>${mdw(i.date)} ${esc(cn(i.c))}</b><span class="tag ${i.type==='absence'?'bad':'info'}">${i.type==='absence'?'결강':'수업 교환'}</span><span class="tag bad" style="margin-left:auto">${sic('check',11)} 확인 필요</span></div>
    <div class="vs"><div><small>기존</small>${i.p}교시 · ${PT(i.p)}</div><span>→</span>${aft}</div>
    <div class="cmp"><div><h4>기존</h4>${miniWeek(SCH,mondayOf(i.date),i,'before',SCH)}</div><div><h4>변경 후</h4>${miniWeek(after,mondayOf(i.date),i,'after',SCH)}</div></div>
    ${usable?`<div class="note">${esc(cn(i.c))} ${i.type==='absence'?shiftNote(SCH,after,i.c,n):`${n}차시 수업 시간이 바뀌어요`}.${ex?` ${esc(ex.title)} 전까지 예상 진도 ${predTxt(b)} → <b>${predTxt(a)}</b>.`:''} 실제 수업 기록은 바뀌지 않아요.</div>`:`<p class="warnbox">${mvErr?esc(mvErr):'원래 수업 칸이 이미 결손·교환돼 있어 그대로 반영할 수 없어요.'}</p>`}
    <div class="ft"><span>${esc(i.why)} · ${esc(i.src)}</span><span class="gap"></span><button class="btn sm" data-a="dismiss" data-x="${i.id}">반영 안 함</button><button class="btn sm pri" data-a="accept" data-x="${i.id}" ${usable?'':'disabled'}>진도 계획에 반영</button></div></div>`}
function excRow(e,sbId='',pre=''){const on=e.state==='active';
  const t=e.type==='absence'?`${mdw(e.date)} ${e.p}교시 결손 · ${esc(e.reason)}`:e.type==='extra'?`${mdw(e.date)} ${e.p}교시 수업 보강`:`${md(e.date)} ${e.p}교시 → ${mdw(e.toDate)} ${e.toP}교시 교환`;
  return `<div class="exc ${on?'':'off'}" style="--cc:${ccv(e.c)}" ${sbId?`data-sub="${sbId}"`:''}><span class="bar"></span><span><b>${pre?`<small class="muted">${esc(pre)}</small> `:''}${esc(cn(e.c))} ${t}</b><small>${esc(e.note||'')}${e.note?' · ':''}${esc(e.src)} · ${esc(e.at)} 등록${on?'':' · 취소됨'}</small></span>
  ${on?`<button class="btn sm" data-a="excoff" data-x="${e.id}">${EXN[e.type]} 취소</button>`:`<button class="btn sm" data-a="excon" data-x="${e.id}">다시 적용</button>`}</div>`}
const schedSeg=()=>`<span class="seg" role="group" aria-label="보기"><button data-a="sm" data-x="tt" aria-pressed="${U.schedMode==='tt'}">시간표</button><button data-a="sm" data-x="cal" aria-pressed="${U.schedMode==='cal'}">캘린더</button></span>`;
/* 주간 시간표는 교사의 시간표 하나: 같은 학년도·학기의 모든 교과를 한꺼번에 보여준다 */
const subPre=(sb,subs)=>subs.length>1?(subs.filter(z=>z.subj===sb.subj).length>1?subjMain(sb):(sb.subj||subjMain(sb))):'';
const semList=()=>{const m=new Map();STORE.subjects.forEach(x=>{const y=x.year||0,e=x.sem||0;m.set(y+'|'+e,{y,e})});return [...m.values()].sort((a,b)=>a.y-b.y||a.e-b.e)};
const semBar=()=>{const cs=curSub(),l=semList();if(!l.length)return '';const cur=`${cs.year?cs.year+' ':''}${cs.sem}학기`;
  return `<details class="semdd"><summary>${cur} <span aria-hidden="true">▾</span></summary><div class="semmenu">${l.map(z=>`<button data-a="semsel" data-x="${z.y}|${z.e}" aria-pressed="${(cs.year||0)===z.y&&(cs.sem||0)===z.e}">${z.y?z.y+' ':''}${z.e}학기</button>`).join('')}</div></details>`};
function schedRange(){const t=ttSubs().map(x=>x.db.term);return {lo:t.reduce((a,x)=>x.start<a?x.start:a,t[0].start),hi:t.reduce((a,x)=>x.end>a?x.end:a,t[0].end)}}
const clampK=(k,r)=>k<r.lo?r.lo:k>r.hi?r.hi:k;
const srInfo=()=>{const r=schedRange();return {...r,mlo:mondayOf(r.lo),mhi:mondayOf(r.hi),a:+r.lo.slice(0,4)*12+ +r.lo.slice(5,7)-1,b:+r.hi.slice(0,4)*12+ +r.hi.slice(5,7)-1}};
function clampSched(){const r=schedRange(),mlo=mondayOf(r.lo),mhi=mondayOf(r.hi);
  U.ttWeek=U.ttWeek<mlo?mlo:U.ttWeek>mhi?mhi:U.ttWeek;U.week=U.week<mlo?mlo:U.week>mhi?mhi:U.week;
  const ym=+U.month.y*12+U.month.m,a=+r.lo.slice(0,4)*12+ +r.lo.slice(5,7)-1,b=+r.hi.slice(0,4)*12+ +r.hi.slice(5,7)-1;
  if(ym<a||ym>b){const t=ym<a?a:b;U.month={y:Math.floor(t/12),m:t%12}}
  if(U.sel<r.lo||U.sel>r.hi)U.sel=clampK(U.sel,r)}
function ttSubs(){const cs=curSub();const r=STORE.subjects.filter(x=>(x.year||0)===(cs.year||0)&&(x.sem||0)===(cs.sem||0));return r.length?r:[cs]}
function vSched(){clampSched();return topbarC('시간표·캘린더',semBar(),schedSeg())+(U.schedMode==='tt'?ttBody():calBody())}
function ttBody(){
  const subs=ttSubs(),multi=subs.length>1;

      (cellH[k+'|'+x.p]=cellH[k+'|'+x.p]||[]).push({id:sb.id+'|'+x.c,html:sessChip(x,true,pre,`data-sub="${sb.id}"`)})}));
    DB.inbox.filter(i=>i.state==='pending').forEach(i=>pends.push(`<div data-sub="${sb.id}">${(pre?`<p class="muted" style="margin:0 0 4px;font-size:12px;font-weight:700">${esc(pre)}</p>`:'')+inboxCard(i)}</div>`));
    SCH.conflicts.forEach(x=>confs.push({sb,pre,x,txt:`${pre?pre+' ':''}${esc(cn(x.c))} ${x.n}차시(${md(x.date)})`}));
    if(!DB.tt.some(t=>t.slots.length))emptys.push({sb,pre});
    DB.exc.filter(e=>U.excFilter==='all'||e.state==='active').forEach(e=>exAll.push({id:sb.id+'|'+e.c,date:e.date,html:excRow(e,sb.id,pre)}));
    ttBtns.push(`<button class="btn sm ${DB.tt.some(t=>t.slots.length)?'':'pri'}" data-sub="${sb.id}" data-a="ttedit">${pre?esc(pre)+' ':''}기본 시간표 편집</button>`)}));
  if(U.ttClass!=='all'&&!filt.some(f=>f.id===U.ttClass))U.ttClass='all';
  const blockOf=k=>subs.every(sb=>dayBlock(sb.db,k))?dayBlock(subs[0].db,k):null;
  let rows='';for(let p=1;p<=7;p++){rows+=`<tr><th class="mono">${p}<br><span style="font-weight:400;font-size:10px">${PT(p)}</span></th>${days.map(k=>{
    const g=blockOf(k);if(g)return p===1?`<td rowspan="7" class="hol">${esc(g)}</td>`:'';
    const all=cellH[k+'|'+p]||[],ss=all.filter(x=>U.ttClass==='all'||x.id===U.ttClass);
    if(!all.length)return `<td class="addable" data-a="bogang" data-x="${k}|${p}" title="빈 칸을 누르면 수업 보강을 추가해요"><span class="plus">+ 보강</span></td>`;
    return `<td>${ss.length?`<div class="stk">${ss.map(x=>x.html).join('')}</div>`:''}</td>`}).join('')}</tr>`}
  const exs=exAll.filter(e=>U.ttClass==='all'||e.id===U.ttClass).sort((a,b)=>a.date<b.date?1:-1);
  const noTT=emptys[0];
  return (noTT?`<div class="alertbar w"><span>${multi?`<b>${esc(noTT.pre)}</b> `:''}아직 기본 시간표가 없어요. 요일·교시별로 어느 반 수업인지 입력하세요.</span><button class="btn sm pri" data-sub="${noTT.sb.id}" data-a="ttedit">기본 시간표 입력</button></div>`:'')+
  (pends.length?`<div class="alertbar">${jd(30)}<span>확인이 필요한 시간표 변경이 ${pends.length}건 있어요. 반영하기 전까지 진도 계획은 그대로예요.</span></div>`:'')+
  (confs.length?`<div class="alertbar w"><span>${sic('check',14)} 완료 기록과 맞지 않는 일정이 ${confs.length}건 있어요: ${confs.map(z=>z.txt).join(', ')}</span><button class="btn sm" data-sub="${confs[0].sb.id}" data-a="cell" data-x="${confs[0].x.c}|${confs[0].x.n}">기록 확인</button></div>`:'')+`
  <div class="grid ttlay ${pends.length?'':'solo'}"><div class="stack">
    <div class="card"><h2>주간 시간표 <span class="sub">${multi?'모든 교과 · ':''}칸을 누르면 완료·결손·교환을 처리하고, 빈 칸을 누르면 수업 보강을 추가해요</span></h2>
      <div class="calbar"><button class="btn sm" data-a="ttw" data-x="-1" aria-label="이전 주" ${mon<=SR.mlo?'disabled':''}>‹</button><span class="ttl mono">${md(days[0])} ~ ${md(days[4])}</span><button class="btn sm" data-a="ttw" data-x="1" aria-label="다음 주" ${mon>=SR.mhi?'disabled':''}>›</button><button class="btn sm" data-a="ttw" data-x="0" ${mon===mondayOf(TK)||TK<SR.lo||TK>SR.hi?'disabled':''}>이번 주</button>
        <div class="filters"><button class="chip ttf" data-a="ttc" data-x="all" aria-pressed="${U.ttClass==='all'}">전체</button>${filt.map(f=>f.html.replace(/@@([^"]*)/,(m,id)=>String(U.ttClass===id))).join('')}</div></div>

      <div class="legend" style="margin:10px 0 0">${['done','plan','check','absent','moved'].map(s=>`<span>${stag(s)}</span>`).join('')}<span style="margin-left:auto;display:flex;gap:6px;flex-wrap:wrap">${ttBtns.join('')}</span></div></div>
    <div class="card"><h2>결손 · 교환 · 보강 기록 <span class="sub">지우지 않고 남겨서 언제든 되돌릴 수 있어요</span><span class="right"><span class="seg"><button data-a="excf" data-x="active" aria-pressed="${U.excFilter==='active'}">적용 중</button><button data-a="excf" data-x="all" aria-pressed="${U.excFilter==='all'}">전체</button></span></span></h2>
      <div class="excl">${exs.map(e=>e.html).join('')||'<p class="muted" style="margin:0">기록이 없어요. 시간표 칸을 눌러 결손이나 교환을, 빈 칸을 눌러 보강을 등록하세요.</p>'}</div></div>
  </div>${pends.length?`<div class="stack"><div class="card"><h2>확인이 필요한 변경 <span class="sub">비교 → 반영</span></h2>${pends.join('')}</div></div>`:''}</div>`;
}

/* ---------- 캘린더 ---------- */
const kindOf=s=>s.status==='done'?'done':(s.status==='plan'||s.status==='check')?'plan':'off';
const filtEv=k=>eventsOn(DB,k).filter(e=>e.kind==='hol'||U.flt[e.kind]!==false);
const filtS=k=>(SCH.by[k]||[]).filter(s=>U.flt[kindOf(s)]);
function calBody(){const SRc=srInfo();
  const chips=[['done','완료'],['plan','예정·확인 필요'],['off','결손·교환'],['event','학교 행사'],['task','수행평가'],['exam','정기시험']].map(([k,l])=>`<button class="chip" data-a="flt" data-x="${k}" aria-pressed="${U.flt[k]}">${l}</button>`).join('');
  /* 모든 교과를 한 캘린더에: 교과마다 자기 학기 기간(1학기 3~7월, 2학기 8~1월 등) 안에서만 수업이 나온다 */
  const subs=STORE.subjects,multi=subs.length>1;
  let dates,grid,title;
  if(U.calMode==='month'){const {y,m}=U.month,first=new Date(y,m,1),st=addDays(first,-first.getDay());dates=[];for(let i=0;i<42;i++){const dt=addDays(st,i);if(i>=35&&dt.getMonth()!==m)break;dates.push(key(dt))}}
  else dates=[0,1,2,3,4].map(i=>addK(U.week,i));
  const DD={};[...dates,U.sel].forEach(k=>DD[k]={evs:[],ss:[]});
  const seen={};
  subs.forEach(sb=>withSub(sb,()=>{const pre=subPre(sb,subs);
    Object.keys(DD).forEach(k=>{
      eventsOn(DB,k).forEach(e=>{if(e.kind==='exam'&&[0,6].includes(D(k).getDay()))return;const id=[k,e.kind,e.label].join('|');if(seen[id])return;seen[id]=1;DD[k].evs.push({e,sid:sb.id})});
      (SCH.by[k]||[]).forEach(s=>DD[k].ss.push({sb,s,pre,
        chip:sessChip(s,true,pre,`data-sub="${sb.id}"`),
        pip:`<span class="pip ${s.status==='done'?'':s.status}" style="--cc:${ccv(s.c)}" title="${esc(pre)}">${esc(cn(s.c))}</span>`,
        row:`<div style="display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px;align-items:center">${sessChip(s,true,pre,`data-sub="${sb.id}"`)}<span style="font-size:12px;min-width:0">${s.p}교시 · ${stag(s.status)} ${s.n?`${s.n}차시 ${esc(lname(s.n))}`:s.status==='moved'?moveDest(s):s.status==='absent'?esc((excOf(s)?.reason||'')+' '+(excOf(s)?.note||'')):''}</span></div>`}))})}));
  const evVis=k=>DD[k].evs.filter(x=>x.e.kind==='hol'||U.flt[x.e.kind]!==false);
  const ssVis=k=>DD[k].ss.filter(x=>U.flt[kindOf(x.s)]).sort((a,b)=>a.s.p-b.s.p);
  if(U.calMode==='month'){const {y,m}=U.month;title=`${y}. ${pad(m+1)}`;
    let cells='';dates.forEach(k=>{const dt=D(k);
      const hol=DD[k].evs.some(x=>x.e.kind==='hol')||dt.getDay()===0;
      cells+=`<button class="day ${dt.getMonth()!==m?'out':''} ${k===TK?'today':''} ${k===U.sel?'sel':''} ${hol?'hol':''}" data-a="day" data-x="${k}" aria-label="${md(k)}"><span class="dn mono">${dt.getDate()}</span>${evVis(k).map(x=>`<span class="ev ${x.e.kind}">${esc(x.e.label)}</span>`).join('')}<span class="pips">${ssVis(k).map(x=>x.pip).join('')}</span></button>`});
    grid=`<div class="calg">${[...WD].map(w=>`<div class="wd">${w}</div>`).join('')}${cells}</div>`;
  }else{title=`${md(U.week)} ~ ${md(addK(U.week,4))}`;
    grid=`<div class="weekg">${dates.map(k=>`<div class="wcol ${k===TK?'today':''} ${k===U.sel?'sel':''}" data-a="day" data-x="${k}"><span class="wh">${wd(k)} <b class="mono">${md(k)}</b></span>${evVis(k).map(x=>`<span class="ev ${x.e.kind}">${esc(x.e.label)}</span>`).join('')}${ssVis(k).map(x=>x.chip).join('')}</div>`).join('')}</div>`;}
  const k=U.sel,evs=DD[k].evs,ss=DD[k].ss.sort((a,b)=>a.s.p-b.s.p),tds=DB.todos.map((t,i)=>({...t,i})).filter(t=>t.date===k);
  const actSubs=[...new Map(ss.filter(x=>['plan','check','done'].includes(x.s.status)).map(x=>[x.sb.id,x.sb])).values()];
  const blk=subs.length&&subs.every(sb=>dayBlock(sb.db,k))?dayBlock(subs[0].db,k):null;
  const KIND={hol:'휴업·휴일',exam:'정기시험',task:'수행평가',event:'학교 행사'};
  const det=`<div class="card"><h2>${mdw(k)} <span class="sub">${k<TK?'지난 날':k===TK?'오늘':dday(k)+'일 뒤'}</span>${actSubs.length?`<span class="right" style="display:flex;gap:6px;flex-wrap:wrap">${actSubs.map(sb=>`<button class="btn sm bad" data-sub="${sb.id}" data-a="absday" data-x="${k}">${multi?esc(subPre(sb,subs))+' ':''}이날 수업 결손 처리</button>`).join('')}</span>`:''}</h2>
    ${evs.length?`<div class="dlist" style="margin-bottom:6px">${evs.map(({e,sid})=>`<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="ev ${e.kind}">${KIND[e.kind]}</span><span>${esc(e.label)}</span>${e.src?`<span class="muted" style="font-size:11px">${esc(e.src)}</span>`:''}${e.assessId?`<button class="btn sm" style="margin-left:auto" data-sub="${sid}" data-a="avedit" data-x="${e.assessId}">수정</button>`:e.id?`<button class="btn sm bad" style="margin-left:auto" data-sub="${sid}" data-a="evdel" data-x="${e.id}">삭제</button>`:''}</div>`).join('')}</div>`:''}

    <div class="sect" style="margin-top:6px">수업 <span style="font-weight:400">· 누르면 완료·결손·교환</span></div>

    <div class="sect">이날 할 일 · 메모</div>
    <ul class="todo">${tds.map(t=>todoLi(STORE.cur,t.i,t,'ctd')).join('')||'<li class="muted">없음</li>'}</ul>

    <form id="evForm" class="inl"><label class="field" style="flex:0 0 120px">종류<select id="evK"><option value="event">학교 행사</option><option value="hol">휴업일 (수업 없음)</option></select></label><label class="field">제목<input id="evT" placeholder="예: 체육대회"></label><button class="btn sm">추가</button></form>
    <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap"><button class="btn sm" data-a="avnew" data-x="task|${k}">이날 수행평가 추가</button><button class="btn sm" data-a="avnew" data-x="exam|${k}">이날부터 정기시험 추가</button></div></div>`;
  return `<div class="grid callay"><div class="card">
   <div class="calbar"><span class="seg" role="group" aria-label="보기"><button data-a="calm" data-x="month" aria-pressed="${U.calMode==='month'}">월간</button><button data-a="calm" data-x="week" aria-pressed="${U.calMode==='week'}">주간</button></span>
   <button class="btn sm" data-a="mon" data-x="-1" aria-label="이전" ${(U.calMode==='month'?(+U.month.y*12+U.month.m<=SRc.a):(U.week<=SRc.mlo))?'disabled':''}>‹</button><span class="ttl mono">${title}</span><button class="btn sm" data-a="mon" data-x="1" aria-label="다음" ${(U.calMode==='month'?(+U.month.y*12+U.month.m>=SRc.b):(U.week>=SRc.mhi))?'disabled':''}>›</button><button class="btn sm" data-a="today" ${TK<SRc.lo||TK>SRc.hi?'disabled':''}>오늘</button>

/* ---------- 급식 ---------- */
const ALG={1:'난류',2:'우유',3:'메밀',4:'땅콩',5:'대두',6:'밀',7:'고등어',8:'게',9:'새우',10:'돼지고기',11:'복숭아',12:'토마토',13:'아황산류',14:'호두',15:'닭고기',16:'쇠고기',17:'오징어',18:'조개류',19:'잣'};
const mainDishes=a=>{const f=a.filter(n=>{const t=n.replace(/\s/g,'');
    if(/(김치|깍두기|겉절이|석박지)$/.test(t)||/^(흰죽|흰쌀죽)$/.test(t))return false;
    if(/밥$/.test(t)&&!/(볶음|비빔|덮|김|주먹|초|유부|카레|오므|영양|컵|쌈)밥$/.test(t))return false;return true});return f.length?f:a};
/* 오후 2시가 지나면 밥숑은 다음 급식일(내일, 없으면 그다음 급식이 있는 날) 급식을 알려준다 */
const mealPick=()=>{if(NOWMIN<840)return {k:TK,next:false};for(let i=1;i<=21;i++){const k=addK(TK,i);if(MEALS[k]&&MEALS[k].items.length)return {k,next:true}}return {k:null,next:true}};
function vMeal(){const mon=U.mealWeek;const ready=NEIS.key&&NEIS.school;
  const days=[0,1,2,3,4].map(i=>addK(mon,i));
  if(ready&&!TOUR&&!U.neis.busy&&days.some(k=>!MEALS[k])&&!U.mealTried?.[mon]){U.mealTried={...(U.mealTried||{}),[mon]:1};setTimeout(()=>loadMeals(mon,false),0)}
  const cards=days.map(k=>{const m=MEALS[k];
    return `<div class="card mday ${k===TK?'today':''}"><h3>${wd(k)} <span class="mono muted">${md(k)}</span>${k===TK?'<span class="tag info">오늘</span>':''}</h3>${m?mealList(m):`<p class="muted" style="margin:0">${ready?(U.neis.busy?'불러오는 중…':'정보 없음'):'—'}</p>`}</div>`}).join('');
  const pk=mealPick();
  if(ready&&!TOUR&&pk.next&&!pk.k&&!U.neis.busy){const need=[0,1,2].map(o=>mondayOf(addK(TK,7*o))).find(m=>!(U.mealTried||{})['n'+m]&&[0,1,2,3,4].some(i=>addK(m,i)>TK&&!MEALS[addK(m,i)]));if(need){U.mealTried={...(U.mealTried||{}),['n'+need]:1};setTimeout(()=>loadMeals(need,false),0)}}
  const dayWord=!pk.next?'오늘':pk.k===addK(TK,1)?'내일':`다음 급식일인 ${mdw(pk.k||TK)}`;
  const mt=pk.k?MEALS[pk.k]:null,names=mainDishes(mt?mt.items.map(x=>x.name):[]);
  const hits=mt?mt.items.filter(it=>it.alg&&it.alg.split('.').some(x=>ALGS.includes(x))).map(x=>x.name):[];
  const say=!ready?'멍! 급식은 제가 알려드릴게요. <b>설정에서 NEIS를 연결</b>해 주세요.':names.length?`${dayWord} 급식은 <b>${esc(names.slice(0,3).join(', '))}</b>${names.length>3?' 등':''}이에요!`:pk.next&&!pk.k?`${esc(NEIS.school.name)}의 다음 급식을 찾고 있어요. 주를 넘겨서 확인해 보세요.`:`${esc(NEIS.school.name)} 급식이에요. 주를 넘겨서 확인해 보세요.`;
  const hint=ready?(ALGS.length?(hits.length?`<b style="color:var(--bad)">${dayWord} 조심: ${esc(hits.join(', '))}</b>`:`고른 알레르기 성분은 ${dayWord} 메뉴에 없어요.`):'아래에서 알레르기를 고르면 해당 메뉴를 빨갛게 표시해요.')+(pk.next?' · 오후 2시가 지나 다음 급식을 알려줘요':''):'';
  return topbar('급식')+`<div class="speak ${sayPop('meal',say+hint)}"><div class="who">${bab(104)}<span class="whon">밥숑</span></div><div class="bub" aria-live="polite">${say}${hint||ready?`<div class="bsub">${ready?esc(NEIS.school.name)+' · ':''}${hint}</div>`:''}</div></div>
  <div class="mealtools">${ready?`<button class="btn sm" data-a="mw" data-x="-1">‹ 지난주</button><button class="btn sm" data-a="mw" data-x="0">이번 주</button><button class="btn sm" data-a="mw" data-x="1">다음 주 ›</button><button class="btn sm pri" data-a="mealload">새로 불러오기</button>`:`<button class="btn pri" data-a="go" data-x="set">NEIS 연결하기</button>`}</div>
  ${U.neis.err&&U.neis.msg&&U.view==='meal'?`<p class="warnbox" style="margin-bottom:12px">${esc(U.neis.msg)}</p>`:''}
  <div class="grid week5">${cards}</div>
  <div class="card" style="margin-top:16px"><h2>알레르기 표시 <span class="sub">메뉴 옆 번호 = 알레르기 유발 식품 번호</span></h2><div class="alg">${Object.entries(ALG).map(([n,l])=>`<button data-a="alg" data-x="${n}" aria-pressed="${ALGS.includes(n)}"><span class="mono">${n}</span> ${l}</button>`).join('')}</div></div>`;

  const url=`https://open.neis.go.kr/hub/${svc}?${q}`;let r;
  try{r=await fetch(NEIS.proxy?NEIS.proxy+encodeURIComponent(url):url)}catch(e){throw {msg:'NEIS에 연결하지 못했어요. 인터넷 연결을 확인하세요. 미리보기 화면처럼 외부 연결이 막힌 곳에서는 동작하지 않아요. 웹에 올린 앱(GitHub Pages 등)에서 다시 시도하고, 그래도 안 되면 설정의 프록시 주소를 쓰세요.'}}
  if(!r.ok)throw {msg:`NEIS 응답 오류 (${r.status}). 잠시 뒤 다시 시도하세요.`};
  let j;try{j=await r.json()}catch(e){throw {msg:'NEIS 응답을 읽지 못했어요. 프록시 주소가 맞는지 확인하세요.'}}
  if(j.RESULT){if(j.RESULT.CODE==='INFO-200')return [];throw {msg:neisErr(j.RESULT)}}
  const arr=j[svc];if(!arr)return [];const res=(arr[0].head||[]).find(h=>h.RESULT)?.RESULT;
  if(res&&res.CODE!=='INFO-000')throw {msg:neisErr(res)};return (arr[1]&&arr[1].row)||[]}

function parseTable(txt){const rows=[];let row=[],cell='',q=false;txt=txt.replace(/\r\n?/g,'\n');
  for(let i=0;i<txt.length;i++){const ch=txt[i];if(q){if(ch==='"'&&txt[i+1]==='"'){cell+='"';i++}else if(ch==='"')q=false;else cell+=ch}
    else if(ch==='"'&&cell==='')q=true;else if(ch==='\t'){row.push(cell);cell=''}else if(ch==='\n'){row.push(cell);rows.push(row);row=[];cell=''}else cell+=ch}
  if(cell!==''||row.length){row.push(cell);rows.push(row)}return rows.filter(r=>r.some(v=>v.trim()))}
